[workspace]
# The BLE adapter needs libdbus; keep it out of default root builds so the
# existing --all-features media CI does not require it.
members = [".", "services/ble", "services/phone", "tools/stephctl"]
default-members = ["."]

[package]
name = "stephania"
default-run = "stephania"
version = "0.1.0"
edition = "2021"
description = "Raspberry Pi 5 LT stream box controller foundation"
license = "MIT"

[features]
default = ["native-capture", "native-x264", "native-aac", "networkmanager"]
native-capture = ["dep:v4l", "dep:alsa"]
native-x264 = []
native-aac = []
ci-virtual = []
# NetworkManager D-Bus backend for stephania-provision (pure-Rust zbus).
networkmanager = ["dep:zbus"]

[dependencies]
v4l = { version = "0.14.0", optional = true }
alsa = { version = "0.12.1", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
serde_json = "1"
libc = "0.2"
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }
png = "0.18"

[[bin]]
name = "stephania-native-av"
path = "src/bin/stephania-native-av.rs"
required-features = ["native-capture", "native-x264", "native-aac"]

[[bin]]
name = "stephania-ci-encode"
path = "src/bin/stephania-ci-encode.rs"
required-features = ["native-x264", "native-aac"]


[[bin]]
name = "stephania-native-video"
path = "src/bin/stephania-native-video.rs"
required-features = ["native-capture", "native-x264"]

[[bin]]
name = "stephania-native-probe"
path = "src/bin/stephania-native-probe.rs"
required-features = ["native-capture"]
