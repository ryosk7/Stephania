[package]
name = "t3box"
default-run = "t3box"
version = "0.1.0"
edition = "2021"
description = "Raspberry Pi 5 LT stream box controller foundation"
license = "MIT"

[features]
default = []
native-capture = ["dep:v4l", "dep:alsa"]
native-x264 = ["dep:x264"]

[dependencies]
v4l = { version = "0.14.0", optional = true }
alsa = { version = "0.12.1", optional = true }
x264 = { version = "0.5.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
