name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run three-hour paced native codec soak (manual only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
      transport: ${{ steps.plan.outputs.transport }}
      quality: ${{ steps.plan.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI measurement and selection contracts
        run: |
          python3 ci/test-ci-contracts.py
          python3 ci/plan.py --self-test
          python3 -m compileall -q ci
          for f in ci/*.sh tests/*.sh tests/virtual-lab/*.sh; do bash -n "$f"; done
          python3 -m compileall -q tests/virtual-lab
      - name: Validate workflow syntax and expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -shellcheck="" -pyflakes=""
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/plan.py

  rust-check:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-check
      - uses: ./.github/actions/native-deps
      - run: |
          cargo test --locked --all-features -- --skip accelerated_ci::
          cargo test --locked --no-default-features
      - run: cargo clippy --all-targets --locked --all-features -- -D warnings
      - run: cargo build --release --locked --no-default-features --bin t3box

  arm64-build:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shared-arm64-release
      - uses: ./.github/actions/native-deps
      - run: cargo build --release --locked --all-features --bin t3box --bin t3box-native-av --bin t3box-ci-encode
      - uses: actions/upload-artifact@v4
        with:
          name: ci-native-binaries
          path: |
            target/release/t3box
            target/release/t3box-native-av
            target/release/t3box-ci-encode
          retention-days: 1
          compression-level: 0

  arm64-logical:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm-logical
      - uses: ./.github/actions/native-deps
      - name: Build release tests once
        run: cargo test --release --locked --all-features --no-run
      - name: Native unit and accelerated simulation (60s)
        run: |
          mkdir -p fast-results
          /usr/bin/time -f 'elapsed_seconds=%e' -o fast-results/timing.txt timeout 60 cargo test --release --locked --all-features -- --test-threads=2 2>&1 | tee fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_three_hour_clock_and_framing ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_venue_fault_scenarios ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_transition_matches_real_pcm_path ... ok" fast-results/simulation.txt
          cat fast-results/timing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logical-results
          path: fast-results/
          retention-days: 3

  arm64-transport:
    needs: [plan, arm64-build]
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.transport) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg iproute2 openssl stress-ng
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/t3box target/release/t3box-native-av target/release/t3box-ci-encode
      - name: Run selected transport suite (60s)
        env:
          SCENARIO: ${{ matrix.scenario }}
          T3BOX_ROOT: ${{ github.workspace }}
        run: timeout --kill-after=5s 60 bash ci/transport-suite.sh "$SCENARIO"
      - name: Publish transport results even on failure
        if: always()
        run: |
          for report in transport-results/*/summary.md e2e-results/summary.md; do
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-${{ matrix.scenario }}
          path: transport-results/
          retention-days: 3

  arm64-quality:
    needs: [plan, arm64-build]
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.quality) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/t3box target/release/t3box-native-av target/release/t3box-ci-encode
      - name: Prepare constrained encoder image
        run: |
          bash ci/images/benchmark.sh
      - name: Measure quality profiles (60s)
        env:
          T3BOX_BENCH_PRESET: ${{ matrix.preset }}
          T3BOX_BENCH_BITRATE: ${{ matrix.bitrates }}
          T3BOX_BENCH_PREBUILT: "1"
        run: |
          timeout --kill-after=5s 60 bash ci/pi5-benchmark.sh ci-results
      - name: Publish quality results even on failure
        if: always()
        run: |
          if [[ -f ci-results/summary.md ]]; then cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "Quality measurements incomplete; inspect artifacts and logs." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.preset }}
          path: |
            ci-results/*.json
            ci-results/*.txt
            ci-results/*.log
            ci-results/*.png
            ci-results/*.md
            ci-results/*.failed
          retention-days: 3

  ci-gate:
    if: always()
    needs: [plan, rust-check, arm64-build, arm64-logical, arm64-transport, arm64-quality, arm64-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          REASON: ${{ needs.plan.outputs.reason }}
          FULL: ${{ needs.plan.outputs.full }}
          RUST: ${{ needs.rust-check.result }}
          BUILD: ${{ needs.arm64-build.result }}
          LOGICAL: ${{ needs.arm64-logical.result }}
          TRANSPORT: ${{ needs.arm64-transport.result }}
          QUALITY: ${{ needs.arm64-quality.result }}
          SOAK: ${{ needs.arm64-soak.result }}
          SOAK_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.soak }}
        run: |
          test "$PLAN" = success
          echo "Coverage selection: $REASON" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SOAK_REQUESTED" == true ]]; then test "$SOAK" = success; else test "$SOAK" = skipped; fi
          if [[ "$FULL" == true ]]; then
            for result in "$RUST" "$BUILD" "$LOGICAL" "$TRANSPORT" "$QUALITY"; do test "$result" = success; done
          else
            test "$FULL" = false
            test "$REASON" = docs-only
            for result in "$RUST" "$BUILD" "$LOGICAL" "$TRANSPORT" "$QUALITY"; do test "$result" = skipped; done
          fi

  arm64-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libx264-dev libavcodec-dev libavutil-dev pkg-config
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - run: bash ci/soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-three-hour-soak
          path: soak-results/
