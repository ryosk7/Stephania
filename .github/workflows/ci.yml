name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run three-hour paced native codec soak (manual only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      full: ${{ steps.plan.outputs.full }}
      transport: ${{ steps.plan.outputs.transport }}
      quality: ${{ steps.plan.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/plan.py

  rust-check:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86-check
      - uses: ./.github/actions/native-deps
      - run: cargo test --locked --all-features -- --skip accelerated_ci::
      - run: cargo clippy --all-targets --locked --all-features -- -D warnings

  arm64-logical:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm-logical
      - uses: ./.github/actions/native-deps
      - name: Build release tests once
        run: cargo test --release --locked --all-features --no-run
      - name: Native unit and accelerated simulation (60s)
        run: |
          mkdir -p fast-results
          /usr/bin/time -f 'elapsed_seconds=%e' -o fast-results/timing.txt timeout 60 cargo test --release --locked --all-features -- --nocapture --test-threads=2 2>&1 | tee fast-results/simulation.txt
          cat fast-results/timing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logical-results
          path: fast-results/
          retention-days: 3

  arm64-transport:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.transport) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transport-${{ matrix.scenario }}
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y --no-install-recommends ffmpeg iproute2 openssl stress-ng
      - name: Build release binaries once
        run: cargo build --release --locked --all-features --bin t3box --bin t3box-native-av
      - name: Run selected transport suite (60s)
        env:
          SCENARIO: ${{ matrix.scenario }}
          T3BOX_ROOT: ${{ github.workspace }}
        run: timeout 60 bash ci/transport-suite.sh "$SCENARIO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-${{ matrix.scenario }}
          path: transport-results/
          retention-days: 3

  arm64-quality:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.quality) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-${{ matrix.preset }}
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - name: Prepare constrained encoder image
        run: docker build -t t3box-bench -f ci/Dockerfile.benchmark .
      - name: Measure quality profiles (60s)
        env:
          T3BOX_BENCH_PRESET: ${{ matrix.preset }}
          T3BOX_BENCH_BITRATE: ${{ matrix.bitrates }}
          T3BOX_BENCH_PREBUILT: "1"
        run: |
          timeout 60 bash ci/pi5-benchmark.sh ci-results
          cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.preset }}
          path: |
            ci-results/*.json
            ci-results/*.txt
            ci-results/*.log
            ci-results/*.png
            ci-results/*.md
          retention-days: 3

  ci-gate:
    if: always()
    needs: [plan, rust-check, arm64-logical, arm64-transport, arm64-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          RUST: ${{ needs.rust-check.result }}
          LOGICAL: ${{ needs.arm64-logical.result }}
          TRANSPORT: ${{ needs.arm64-transport.result }}
          QUALITY: ${{ needs.arm64-quality.result }}
        run: |
          test "$PLAN" = success
          if [[ "$FULL" == true ]]; then
            for result in "$RUST" "$LOGICAL" "$TRANSPORT" "$QUALITY"; do test "$result" = success; done
          else
            test "$FULL" = false
            for result in "$RUST" "$LOGICAL" "$TRANSPORT" "$QUALITY"; do test "$result" = skipped; done
          fi

  arm64-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libx264-dev libavcodec-dev libavutil-dev pkg-config
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - run: bash ci/soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-three-hour-soak
          path: soak-results/
