name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run three-hour paced native codec soak (manual only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Independent runners: no competition between codec measurements, netem,
  # Clippy and simulation. No cross-job build/artifact dependency.
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        task: [unit, clippy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - uses: ./.github/actions/native-deps
      - name: Execute selected check
        env:
          TASK: ${{ matrix.task }}
        run: |
          if [[ "$TASK" == unit ]]; then
            cargo test --locked --all-features -- --skip accelerated_ci::
          else
            cargo clippy --all-targets --locked --all-features -- -D warnings
          fi

  arm64-logical:
    strategy:
      fail-fast: false
      matrix:
        test: [accelerated_three_hour_clock_and_framing, accelerated_transition_matches_real_pcm_path, accelerated_venue_fault_scenarios]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: logical-${{ matrix.test }}
      - name: Build optimized test executable
        run: |
          cargo test --release --locked --lib --no-run --message-format=json > /tmp/fast-build.jsonl
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          for line in open('/tmp/fast-build.jsonl'):
              x=json.loads(line)
              if x.get('reason')=='compiler-artifact' and x.get('profile',{}).get('test') and x.get('executable') and x.get('target',{}).get('name')=='t3box':
                  print('FAST_TEST_BIN='+x['executable'])
          PY
      - name: Accelerated logical shard
        env:
          TEST: ${{ matrix.test }}
        run: |
          mkdir -p fast-results
          /usr/bin/time -f 'elapsed_seconds=%e' -o fast-results/timing.txt timeout 60 "$FAST_TEST_BIN" "accelerated_ci::$TEST" --exact --nocapture | tee fast-results/simulation.txt
          grep -q '1 passed; 0 failed' fast-results/simulation.txt
          cat fast-results/timing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logical-${{ matrix.test }}
          path: fast-results/

  arm64-unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm-unit
      - uses: ./.github/actions/native-deps
      - run: cargo test --locked --all-features -- --skip accelerated_ci::

  arm64-transport:
    strategy:
      fail-fast: false
      matrix:
        scenario: [controller, baseline, venue]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: transport-${{ matrix.scenario }}
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y --no-install-recommends ffmpeg iproute2 openssl stress-ng
      - name: Build only required binary
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [[ "$SCENARIO" == controller ]]; then
            cargo build --release --locked --bin t3box
          else
            cargo build --release --locked --all-features --bin t3box-native-av
          fi
      - name: Run isolated transport scenario (60s)
        env:
          SCENARIO: ${{ matrix.scenario }}
          T3BOX_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p e2e-results
          if [[ "$SCENARIO" == controller ]]; then
            timeout 60 bash ci/smoke.sh
          elif [[ "$SCENARIO" == baseline ]]; then
            timeout 60 bash ci/virtual-rtmps.sh
          else
            T3BOX_CI_WIDTH=1920 T3BOX_CI_HEIGHT=1080 T3BOX_CI_BITRATE=6000 T3BOX_CI_FRAMES=300 T3BOX_CI_DYNAMIC=1 T3BOX_CI_LOAD=1 timeout 60 bash ci/virtual-rtmps.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-${{ matrix.scenario }}
          path: e2e-results/

  arm64-quality:
    strategy:
      fail-fast: false
      matrix:
        preset: [ultrafast, veryfast]
        bitrate: [6000, 8000]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-${{ matrix.preset }}-${{ matrix.bitrate }}
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - name: Prepare constrained encoder image
        run: docker build -t t3box-bench -f ci/Dockerfile.benchmark .
      - name: Measure isolated quality profile (60s)
        env:
          T3BOX_BENCH_PRESET: ${{ matrix.preset }}
          T3BOX_BENCH_BITRATE: ${{ matrix.bitrate }}
          T3BOX_BENCH_PREBUILT: "1"
        run: |
          timeout 60 bash ci/pi5-benchmark.sh ci-results
          cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.preset }}-${{ matrix.bitrate }}
          path: ci-results/

  arm64-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libx264-dev libavcodec-dev libavutil-dev pkg-config
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - run: bash ci/soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-three-hour-soak
          path: soak-results/
