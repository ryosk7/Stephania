name: CI
on:
  push:
    branches: [main, test/virtual-lab]
  pull_request:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      soak:
        description: Run three-hour paced native codec soak (manual only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
      transport: ${{ steps.plan.outputs.transport }}
      quality: ${{ steps.plan.outputs.quality }}
      rust: ${{ steps.changes.outputs.rust == 'true' || steps.changes.outputs.media == 'true' }}
      media: ${{ steps.changes.outputs.media }}
      selection: ${{ steps.changes.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI measurement and selection contracts
        run: |
          python3 ci/test-ci-contracts.py
          python3 ci/plan.py --self-test
          python3 ci/changes.py --self-test
          python3 -m compileall -q ci
          for f in ci/*.sh tests/*.sh tests/virtual-lab/*.sh; do bash -n "$f"; done
          python3 -m compileall -q tests/virtual-lab
          python3 ci/check-qualification.py --self-test
          python3 ci/check-qualification.py
          bash -n tools/qualification/collect.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-v1.7.7-${{ runner.os }}-${{ runner.arch }}
      - name: Validate workflow syntax and expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -shellcheck="" -pyflakes=""
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/plan.py
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/changes.py

  rust-check:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: x64-check
          command: |
            cargo clippy --all-targets --locked --all-features -- -D warnings
            cargo clippy --locked -p stephania-phone --all-targets -- -D warnings
            cargo test --locked --all-features -- --skip accelerated_ci::
            ${{ github.event_name == 'pull_request' && 'cargo check --locked --no-default-features --all-targets' || 'cargo test --locked --no-default-features' }}
            cargo test --locked -p stephania-phone

  arm64-build:
    needs: plan
    if: needs.plan.outputs.media == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-release
          command: cargo build --release --locked --all-features --bin stephania --bin stephania-native-av --bin stephania-ci-encode
      - uses: actions/upload-artifact@v4
        with:
          name: ci-native-binaries
          path: |
            target/release/stephania
            target/release/stephania-native-av
            target/release/stephania-ci-encode
          retention-days: 1
          compression-level: 0

  arm64-logical:
    needs: plan
    if: needs.plan.outputs.media == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-test
          command: |
            cargo test --release --locked --all-features --no-run
            mkdir -p fast-results
            /usr/bin/time -f 'elapsed_seconds=%e' -o fast-results/timing.txt timeout 60 cargo test --release --locked --all-features -- --test-threads=2 2>&1 | tee fast-results/simulation.txt
      - name: Verify simulation evidence
        run: |
          grep -q "accelerated_ci::accelerated_three_hour_clock_and_framing ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_venue_fault_scenarios ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_transition_matches_real_pcm_path ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_three_hour_rtmp_roundtrip ... ok" fast-results/simulation.txt
          grep -q "accelerated_ci::accelerated_three_hour_rate_recovery ... ok" fast-results/simulation.txt
          cat fast-results/timing.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logical-results
          path: fast-results/
          retention-days: 3

  arm64-transport:
    needs: [plan, arm64-build]
    if: needs.plan.outputs.media == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.transport) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg iproute2 openssl stress-ng
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/stephania target/release/stephania-native-av target/release/stephania-ci-encode
      - name: Run selected transport suite (60s)
        env:
          SCENARIO: ${{ matrix.scenario }}
          STEPHANIA_ROOT: ${{ github.workspace }}
        run: timeout --kill-after=5s 60 bash ci/transport-suite.sh "$SCENARIO"
      - name: Publish transport results even on failure
        if: always()
        run: |
          for report in transport-results/*/summary.md e2e-results/summary.md; do
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-${{ matrix.scenario }}
          path: transport-results/
          retention-days: 3

  arm64-composition:
    # Live compositor (on by default): HDMI fast path, frame-boundary acknowledged
    # scene.apply over IPC, and a virtual phone track, verified pixel-wise.
    needs: [plan, arm64-build]
    if: needs.plan.outputs.media == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg openssl
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/stephania
      - name: Composed broadcast with scene changes (60s)
        run: timeout --kill-after=5s 60 bash ci/composition-e2e.sh target/release/stephania composition-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition
          path: composition-results/
          retention-days: 3

  arm64-audio:
    # Program audio mix: two virtual inputs reconfigured live over IPC
    # (enable, mute, gain) while publishing; recording analysed per phase.
    needs: [plan, arm64-build]
    if: needs.plan.outputs.media == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg openssl
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/stephania
      - name: Program audio mix with live reconfiguration (30s)
        run: timeout --kill-after=5s 60 bash ci/audio-e2e.sh target/release/stephania audio-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio
          path: audio-results/
          retention-days: 3

  arm64-quality:
    needs: [plan, arm64-build]
    if: needs.plan.outputs.media == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.quality) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - uses: actions/download-artifact@v4
        with:
          name: ci-native-binaries
          path: target/release
      - run: chmod +x target/release/stephania target/release/stephania-native-av target/release/stephania-ci-encode
      - name: Prepare constrained encoder image
        run: |
          bash ci/images/benchmark.sh
      - name: Measure quality profiles (60s)
        env:
          STEPHANIA_BENCH_PRESET: ${{ matrix.preset }}
          STEPHANIA_BENCH_BITRATE: ${{ matrix.bitrates }}
          STEPHANIA_BENCH_PREBUILT: "1"
        run: |
          timeout --kill-after=5s 60 bash ci/pi5-benchmark.sh ci-results
      - name: Publish quality results even on failure
        if: always()
        run: |
          if [[ -f ci-results/summary.md ]]; then cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "Quality measurements incomplete; inspect artifacts and logs." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.preset }}
          path: |
            ci-results/*.json
            ci-results/*.txt
            ci-results/*.log
            ci-results/*.png
            ci-results/*.md
            ci-results/*.failed
          retention-days: 3

  ci-gate:
    if: always()
    needs: [plan, rust-check, arm64-build, arm64-logical, arm64-transport, arm64-composition, arm64-audio, arm64-quality, arm64-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record CI elapsed time and job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 - "$RUNNER_TEMP/ci-jobs.json" <<'PY'
          import datetime,json,os,sys
          jobs=json.load(open(sys.argv[1]))['jobs']
          ts=lambda s:datetime.datetime.fromisoformat(s.replace('Z','+00:00'))
          starts=[ts(j['started_at']) for j in jobs if j.get('started_at') and j['conclusion']!='skipped']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'## CI elapsed to gate: {(datetime.datetime.now(datetime.timezone.utc)-min(starts)).total_seconds():.1f}s\\n\\n')
              f.write('| Job | Seconds | Result |\\n|---|---:|---|\\n')
              for j in jobs:
                  if j.get('started_at') and j.get('completed_at') and j['conclusion']!='skipped':
                      f.write(f"| {j['name']} | {(ts(j['completed_at'])-ts(j['started_at'])).total_seconds():.1f} | {j['conclusion']} |\\n")
          PY
      - env:
          PLAN: ${{ needs.plan.result }}
          REASON: ${{ needs.plan.outputs.reason }}
          FULL: ${{ needs.plan.outputs.full }}
          RUST: ${{ needs.rust-check.result }}
          BUILD: ${{ needs.arm64-build.result }}
          LOGICAL: ${{ needs.arm64-logical.result }}
          TRANSPORT: ${{ needs.arm64-transport.result }}
          COMPOSITION: ${{ needs.arm64-composition.result }}
          AUDIO: ${{ needs.arm64-audio.result }}
          QUALITY: ${{ needs.arm64-quality.result }}
          SOAK: ${{ needs.arm64-soak.result }}
          SOAK_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.soak }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          MEDIA_SELECTED: ${{ needs.plan.outputs.media }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          test "$PLAN" = success
          echo "Coverage selection: $REASON" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SOAK_REQUESTED" == true ]]; then test "$SOAK" = success; else test "$SOAK" = skipped; fi
          echo "Change selection: $SELECTION" >> "$GITHUB_STEP_SUMMARY"
          # Every job must have run and passed when its area was selected,
          # and must have been skipped otherwise (nothing silently missing).
          expect() { if [[ "$1" == true ]]; then test "$2" = success; else test "$2" = skipped; fi; }
          expect "$RUST_SELECTED" "$RUST"
          for result in "$BUILD" "$LOGICAL" "$TRANSPORT" "$COMPOSITION" "$AUDIO" "$QUALITY"; do expect "$MEDIA_SELECTED" "$result"; done

  arm64-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libx264-dev libavcodec-dev libavutil-dev pkg-config
      - run: cargo build --release --locked --features native-aac,native-x264 --bin stephania-ci-encode
      - run: bash ci/soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-three-hour-soak
          path: soak-results/
