name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize formatting in CI workspace
        run: cargo fmt --all
      - name: Rust unit tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  arm64-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Docker image under QEMU
        run: docker buildx build --platform linux/arm64 --load -f ci/Dockerfile.arm64 -t t3box:arm64 .
      - name: ARM64 synthetic audio/video pipeline smoke test
        run: docker run --rm --platform linux/arm64 t3box:arm64 /bin/bash ci/smoke.sh
