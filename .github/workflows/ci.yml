name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run three-hour paced native codec soak (manual only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native capture development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev libx264-dev libavcodec-dev libavutil-dev pkg-config
      - name: Rust unit tests (including native capture)
        run: cargo test --locked --all-features
      - name: Clippy
        run: cargo clippy --all-targets --locked --all-features -- -D warnings

  arm64-native:
    # Hosted AArch64 runner is available for private repos. Not Pi 5 hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install media tools only when missing
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          sudo apt-get install -y --no-install-recommends libasound2-dev libclang-dev libx264-dev libavcodec-dev libavutil-dev pkg-config
      - name: ARM64 unit tests and release binary
        run: |
          test "$(uname -m)" = aarch64
          cargo test --locked --all-features
          cargo build --release --locked --all-features
      - name: ARM64 synthetic A/V stream smoke test
        run: T3BOX_ROOT="$GITHUB_WORKSPACE" bash ci/smoke.sh

      - name: Virtual A/V RTMPS reconnect with network impairment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iproute2 openssl stress-ng
          bash ci/virtual-rtmps.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-virtual-rtmps
          path: e2e-results/
      - name: 1080p30 virtual venue scenario (dynamic network and competing load)
        run: |
          mv e2e-results e2e-baseline
          T3BOX_CI_WIDTH=1920 T3BOX_CI_HEIGHT=1080 T3BOX_CI_BITRATE=6000 T3BOX_CI_FRAMES=300 T3BOX_CI_DYNAMIC=1 T3BOX_CI_LOAD=1 bash ci/virtual-rtmps.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-venue-scenario
          path: e2e-results/
      - name: Pi 5 resource-envelope native codec benchmark
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
          bash ci/pi5-benchmark.sh ci-results
          cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload objective quality and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-native-media-benchmark
          path: ci-results/
          retention-days: 14

  arm64-soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libx264-dev libavcodec-dev libavutil-dev pkg-config
      - run: cargo build --release --locked --features native-aac,native-x264 --bin t3box-ci-encode
      - run: bash ci/soak.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-three-hour-soak
          path: soak-results/
