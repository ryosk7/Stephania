name: Tag release
# Bumping VERSION on main tags v<VERSION> and builds the draft release.
# A tag pushed with GITHUB_TOKEN does not start other workflows, so this
# workflow calls release.yml itself instead of relying on the tag push.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tag-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      created: ${{ steps.t.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::VERSION is not a version: $v"; exit 1; }
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$crate" = "$v" ] || { echo "::error::VERSION ($v) does not match Cargo.toml ($crate)"; exit 1; }
          tag="v$v"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "Stephania $v" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
