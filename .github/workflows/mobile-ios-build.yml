name: Mobile iOS build
# Full simulator build of Stephania Connect with its native modules
# (accessory setup, pinned-fetch, camera). It runs only when the native iOS
# side or its dependencies change, on main for those paths, and on demand.
# arm64 simulator only; CocoaPods downloads are cached. Most of the app is
# Swift (Expo modules), which a C compiler cache cannot speed up.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/modules/*/ios/**
      - apps/mobile/app.json
      - apps/mobile/package-lock.json
      - .github/workflows/mobile-ios-build.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/modules/*/ios/**
      - apps/mobile/app.json
      - apps/mobile/package-lock.json
      - .github/workflows/mobile-ios-build.yml
permissions:
  contents: read
defaults:
  run:
    # Explicit bash: -o pipefail, so `xcodebuild … | tail` fails with xcodebuild.
    shell: bash
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Expo's Swift packages need Swift 6.2 (Xcode 26).
      - name: Select Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: ios-pods-
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean
      - name: Build (arm64 simulator)
        working-directory: apps/mobile
        run: |
          xcodebuild -workspace ios/StephaniaConnect.xcworkspace -scheme StephaniaConnect -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build >"$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -nE "error|Error|failed" "$RUNNER_TEMP/xcodebuild.log" | grep -v "warning" | head -80; tail -60 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
