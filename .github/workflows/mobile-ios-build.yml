name: Mobile iOS build
# Full simulator build of Stephania Connect with its native modules
# (pinned-fetch, camera). macOS runners are billed at a multiple of Linux
# minutes on private repositories, so this runs only when the native iOS
# side or its dependencies change, and on demand. Pull requests compile the
# app's own native modules; main and manual runs build the whole app.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/modules/*/ios/**
      - apps/mobile/app.json
      - apps/mobile/package-lock.json
      - .github/workflows/mobile-ios-build.yml
  # main builds the whole app.
  push:
    branches: [main]
    paths:
      - apps/mobile/modules/*/ios/**
      - apps/mobile/app.json
      - apps/mobile/package-lock.json
      - .github/workflows/mobile-ios-build.yml
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      # Pull requests compile the app's own native modules (Swift) with
      # their dependencies, a few minutes at most; main and manual runs
      # build and link the whole app. Most of the app is Swift (Expo
      # modules), which a C compiler cache cannot speed up.
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean
      - name: Native modules (arm64 simulator)
        if: github.event_name == 'pull_request'
        working-directory: apps/mobile/ios
        run: |
          args=()
          for t in StephaniaAccessorySetup StephaniaCamera StephaniaPinnedFetch; do args+=(-target "$t"); done
          xcodebuild -project Pods/Pods.xcodeproj "${args[@]}" -configuration Debug -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -30
      - name: Whole app (arm64 simulator)
        if: github.event_name != 'pull_request'
        working-directory: apps/mobile
        run: |
          xcodebuild -workspace ios/StephaniaConnect.xcworkspace -scheme StephaniaConnect -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -30
