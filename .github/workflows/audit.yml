name: Supply chain
# Advisories, licence policy and the SBOM (docs/LICENSING.md). Runs when a
# lockfile or the policy changes, nightly (new advisories appear without any
# change here), and on demand.
on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - '**/Cargo.toml'
      - deny.toml
      - '**/package-lock.json'
      - services/control/Gemfile.lock
      - ci/sbom.py
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - '**/package-lock.json'
      - services/control/Gemfile.lock
      - ci/sbom.py
  schedule:
    - cron: '41 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Explicit bash runs steps with -o pipefail: a failing command before
    # `| tee` or `| tail` fails the step.
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check advisories licenses bans sources
          arguments: --all-features
  ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - run: gem install bundler-audit --no-document
      - run: bundle-audit check --update
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/studio, apps/mobile, packages/provisioning-client]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Shipped (production) dependencies only; high and critical fail.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - run: npm ci --no-audit --no-fund
        working-directory: apps/studio
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Inventory, licence policy and SPDX SBOM
        run: python3 ci/sbom.py "$RUNNER_TEMP/sbom" --gems-from-bundle --version "${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          retention-days: 14
