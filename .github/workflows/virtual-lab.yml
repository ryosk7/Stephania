name: Virtual Lab bootstrap (independent)
on:
  push:
    branches: [test/virtual-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capabilities:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y v4l-utils alsa-utils kmod
      - run: bash tests/virtual-lab/probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-capabilities
          path: evidence/
  controller:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        input: [virtual, kernel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y ffmpeg openssl v4l-utils alsa-utils kmod
      - run: cargo build --release --locked --all-features --bin t3box
      - run: |
          if [[ "${{ matrix.input }}" == kernel ]]; then
            sudo modprobe vivid n_devs=1 multiplanar=1
            sudo modprobe snd-aloop
          fi
          LAB_INPUT=${{ matrix.input }} bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-${{ matrix.input }}
          path: evidence/
