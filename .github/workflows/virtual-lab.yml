name: Virtual Lab scenarios
on:
  push:
    branches: [test/virtual-lab]
  workflow_dispatch:
    inputs:
      kernel:
        description: Run dedicated kernel-device host (requires t3box-lab runner)
        type: boolean
        default: false
      soak:
    needs: build
        description: Run three-hour full controller stream
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: virtual-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: shared-arm64-release
      - uses: ./.github/actions/native-deps
      - run: cargo build --release --locked --all-features --bin t3box --bin t3box-native-av --bin t3box-ci-encode
      - uses: actions/upload-artifact@v4
        with:
          name: lab-native-binaries
          path: |
            target/release/t3box
            target/release/t3box-native-av
            target/release/t3box-ci-encode
          retention-days: 1
          compression-level: 0
  capabilities:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y v4l-utils alsa-utils kmod
      - run: bash tests/virtual-lab/probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-capabilities
          path: evidence/
  controller:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        input: [virtual]
        fault: [none, disconnect, stall]
        network: [clean, venue]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg openssl v4l-utils alsa-utils kmod iproute2 fonts-dejavu-core fonts-noto-cjk python3-numpy tesseract-ocr-eng tesseract-ocr-jpn tesseract-ocr
      - uses: actions/download-artifact@v4
        with:
          name: lab-native-binaries
          path: target/release
      - run: chmod +x target/release/t3box target/release/t3box-native-av target/release/t3box-ci-encode
      - uses: actions/cache@v4
        with:
          path: .lab-fixture
          key: lab-mixed-arm64-${{ hashFiles('tests/virtual-lab/fixture.py', 'ci/images/media-tools.Dockerfile') }}
      - run: |
          if [[ "${{ matrix.input }}" == kernel ]]; then
            sudo modprobe vivid n_devs=1 multiplanar=1
            sudo modprobe snd-aloop
          fi
          LAB_FIXTURE_CACHE=.lab-fixture LAB_MEDIA=mixed LAB_INPUT=${{ matrix.input }} LAB_FAULT=${{ matrix.fault }} LAB_NETWORK=${{ matrix.network }} bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-${{ matrix.input }}-${{ matrix.fault }}-${{ matrix.network }}
          path: evidence/
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel
    runs-on: [self-hosted, Linux, ARM64, t3box-lab]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --all-features --bin t3box
      - run: LAB_INPUT=kernel LAB_SECONDS=30 bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-native
          path: evidence/
  soak:
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/native-deps
      - run: sudo apt-get install -y ffmpeg openssl iproute2
      - run: cargo build --release --locked --all-features --bin t3box
      - run: LAB_SECONDS=10800 LAB_FAULT=none bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-controller-soak
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.log
  real-media:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        network: [clean, venue]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libasound2t64 libx264-164 libavcodec60 libavutil58 ffmpeg openssl iproute2 poppler-utils fonts-dejavu-core fonts-noto-cjk python3-numpy tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn
      - uses: actions/download-artifact@v4
        with:
          name: lab-native-binaries
          path: target/release
      - run: chmod +x target/release/t3box target/release/t3box-native-av target/release/t3box-ci-encode
      - run: LAB_MEDIA=real LAB_SECONDS=30 LAB_NETWORK=${{ matrix.network }} bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-media-${{ matrix.network }}
          path: evidence/
          compression-level: 0
