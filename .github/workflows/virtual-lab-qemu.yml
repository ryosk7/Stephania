name: QEMU kernel device integration
on:
  push:
    branches: [test/virtual-lab]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: qemu-lab-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/ryosk7/stephania-qemu-lab
defaults:
  run:
    # Explicit bash runs steps with -o pipefail: a failing command before
    # `| tee` or `| tail` fails the step.
    shell: bash

jobs:
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: boot-cache
        with:
          path: .qemu-lab
          key: qemu-lab-${{ hashFiles('tests/virtual-lab/qemu-prepare.sh', 'tests/virtual-lab/Dockerfile.qemu') }}
      - name: Restore generic boot image
        env:
          TAG: ${{ hashFiles('tests/virtual-lab/qemu-prepare.sh', 'tests/virtual-lab/Dockerfile.qemu') }}
        run: |
          set -Eeuo pipefail
          if [[ ! -s .qemu-lab/Image || ! -s .qemu-lab/root.cpio.gz ]]; then
            # Anonymous pull when public; authenticated fallback while private.
            REF="$IMAGE:$TAG"
            if ! docker pull "$REF"; then
              ctx="$(mktemp -d)"
              cp tests/virtual-lab/qemu-prepare.sh tests/virtual-lab/Dockerfile.qemu "$ctx/"
              docker build --platform linux/arm64 -f "$ctx/Dockerfile.qemu" -t "$REF" "$ctx"
              rm -rf "$ctx"
            fi
            digest="$(docker inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$REF")"
            REF="${digest:-$REF}"
            mkdir -p .qemu-lab
            id="$(docker create "$REF" /unused)"
            docker cp "$id:/image/." .qemu-lab/
            docker rm "$id"
          fi
          (cd .qemu-lab; sha256sum -c manifest.txt)
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.boot-cache.outputs.cache-hit != 'true'
        with:
          path: .qemu-lab
          key: ${{ steps.boot-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-probe
          command: cargo build --release --locked --no-default-features --features native-capture --bin stephania-native-probe
      - run: bash ci/images/pull.sh qemu-tools
      - name: Kernel capture gate (60 seconds including overlay)
        run: |
          mkdir -p vm-evidence
          /usr/bin/time -f 'elapsed_seconds=%e' -o vm-evidence/timing.txt timeout --kill-after=2s 58s bash ci/images/qemu-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qemu-kernel-evidence
          path: vm-evidence/
          retention-days: 7
