name: Studio foundation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      control: ${{ steps.c.outputs.control }}
      studio: ${{ steps.c.outputs.studio }}
      provisioning: ${{ steps.c.outputs.provisioning }}
      mobile: ${{ steps.c.outputs.mobile }}
      mobile_native: ${{ steps.c.outputs.mobile_native }}
      ble: ${{ steps.c.outputs.ble }}
      wifi: ${{ steps.c.outputs.wifi }}
      lan: ${{ steps.c.outputs.lan }}
      phone: ${{ steps.c.outputs.phone }}
      bins: ${{ steps.c.outputs.control == 'true' || steps.c.outputs.studio == 'true' || steps.c.outputs.provisioning == 'true' || steps.c.outputs.mobile == 'true' || steps.c.outputs.wifi == 'true' || steps.c.outputs.lan == 'true' || steps.c.outputs.phone == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/changes.py
  # Every x86_64 binary the jobs below need, built once (ci/build-bins.sh)
  # from main's warm target directory.
  bins:
    needs: changes
    if: needs.changes.outputs.bins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/x64-bins
      - uses: actions/upload-artifact@v4
        with:
          name: ci-bins-x64
          path: ci-bins.tar
          retention-days: 1
          compression-level: 1
  control:
    needs: [changes, bins]
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - name: Resolved Gemfile.lock (commit this until it is tracked)
        if: hashFiles('services/control/Gemfile.lock') != ''
        working-directory: services/control
        run: |
          git ls-files --error-unmatch Gemfile.lock >/dev/null 2>&1 && exit 0
          echo '----- BEGIN Gemfile.lock -----'; cat Gemfile.lock; echo '----- END Gemfile.lock -----'
      - name: Control unit, storage and contract tests
        working-directory: services/control
        run: |
          bundle exec ruby test/control_test.rb
          bundle exec ruby test/storage_test.rb
          bundle exec ruby test/events_test.rb
          bundle exec ruby test/lan_access_test.rb
          bundle exec ruby test/audio_test.rb
          bundle exec ruby test/accounts_test.rb
          bundle exec ruby test/assets_test.rb
          bundle exec ruby test/engine_client_test.rb
      - name: Server-Sent Events through real Puma
        working-directory: services/control
        env:
          T3BOX_REQUIRE_PUMA: '1'
        run: bundle exec ruby test/events_puma_test.rb --verbose
      - name: Puma production boot smoke test
        working-directory: services/control
        shell: bash
        env:
          T3BOX_CONTROL_TOKEN: ci-smoke-token-0123456789abcdef0123
          T3BOX_ENGINE_SOCKET: /tmp/t3box-no-engine.sock
          T3BOX_CONTROL_DB: /tmp/t3box-smoke.db
          T3BOX_CONTROL_PORT: '9393'
        run: |
          bundle exec puma -C config/puma.rb config.ru > puma.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 50); do curl -fs -o /dev/null -H "Authorization: Bearer $T3BOX_CONTROL_TOKEN" http://127.0.0.1:9393/api/v1/capabilities && break; sleep 0.2; done
          curl -fsS -H "Authorization: Bearer $T3BOX_CONTROL_TOKEN" http://127.0.0.1:9393/api/v1/capabilities
          code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $T3BOX_CONTROL_TOKEN" http://127.0.0.1:9393/api/v1/status)
          test "$code" = 503 && grep -q engine_unavailable body.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9393/api/v1/status)
          test "$code" = 401
          v=$(bundle exec ruby -rsequel -e 'print Sequel.sqlite(ARGV[0])[:schema_info].get(:version)' /tmp/t3box-smoke.db)
          test "$v" = 7 || { cat puma.log; exit 1; }
      - name: Validate systemd units
        run: |
          for u in systemd/*.service; do
            out=$(systemd-analyze verify "$PWD/$u" 2>&1 | grep -vE 'is not executable|bluetooth\.service' || true)
            if [ -n "$out" ]; then echo "$out"; exit 1; fi
          done
      - name: Integration test must not be skipped
        working-directory: services/control
        env:
          T3BOX_ENGINE_BIN: ${{ github.workspace }}/ci-bins/t3box-diag
        shell: bash
        run: |
          bundle exec ruby test/engine_integration_test.rb --verbose | tee integration.log
          if grep -q ' S$\|skipped' integration.log; then echo "integration test skipped" >&2; exit 1; fi
      - name: Control-plane load within the section 9 cgroup (YJIT off and on)
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 >/dev/null
          ci/control-load.sh ci-bins/t3box "$RUNNER_TEMP/control-load"
          cat "$RUNNER_TEMP/control-load/control-load.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-load
          path: ${{ runner.temp }}/control-load
          retention-days: 14
  studio:
    needs: [changes]
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match contracts/openapi.yaml
        run: npm run check:api
      - name: Unit and shared-fixture tests
        run: npm test
      - run: npm run build
      - name: Storybook builds and every story renders in light and dark
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: |
          npm run build-storybook
          npm run check:stories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-storybook-shots
          path: apps/studio/storybook-shots
          retention-days: 14
  # Browser end-to-end: real Rust engine (IPC) + Puma control plane serving
  # the built Studio, driven by Playwright Chromium with two browser contexts.
  studio-e2e:
    needs: [changes, bins]
    if: needs.changes.outputs.studio == 'true' || needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - working-directory: apps/studio
        run: npm ci --no-audit --no-fund
      - working-directory: apps/studio
        run: npm run build
      - name: Playwright Studio tests
        working-directory: apps/studio
        env:
          T3BOX_ENGINE_BIN: ${{ github.workspace }}/ci-bins/t3box-diag
          # The runner image ships Google Chrome: no browser download.
          T3BOX_PLAYWRIGHT_CHANNEL: chrome
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-report
          path: |
            apps/studio/playwright-report
            apps/studio/test-results
          retention-days: 7
  # Trusted LAN: device PKI → owner enrollment over the provisioning socket
  # → TLS control plane (real Puma) pinned to the BLE-delivered CA →
  # revocation. ci/lan-tls-e2e.sh.
  lan-tls-e2e:
    needs: [changes, bins]
    if: needs.changes.outputs.lan == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - run: sudo pip3 install --break-system-packages -q cryptography
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - name: LAN TLS end to end
        run: ci/lan-tls-e2e.sh "$PWD/ci-bins"
  # Phone camera path: aiortc sends two H.264 tracks over real WebRTC →
  # control signaling → t3box-phone (webrtc-rs) → engine ingest → libavcodec
  # decode → compositor sources, checked by content (tests/phone).
  phone-webrtc-e2e:
    needs: [changes, bins]
    if: needs.changes.outputs.phone == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2t64 libx264-164 libavcodec60 libavutil58 >/dev/null
          python3 -m pip install --break-system-packages -q aiortc numpy
      - name: Phone WebRTC end to end
        run: tests/phone/run-e2e.sh ci-bins
  provisioning-client:
    needs: [changes, bins]
    if: needs.changes.outputs.provisioning == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/provisioning-client/package-lock.json
      - working-directory: packages/provisioning-client
        run: npm ci --no-audit --no-fund
      - working-directory: packages/provisioning-client
        run: npm run typecheck
      - name: Vectors and TypeScript-to-Rust interop (must not skip)
        working-directory: packages/provisioning-client
        shell: bash
        env:
          T3BOX_PROVISION_BIN: ${{ github.workspace }}/ci-bins/t3box-provision
        run: |
          npx vitest run --reporter=verbose | tee vitest.log
          grep -q 'interop with Rust t3box-provision' vitest.log
          if grep -qiE 'skipped|↓' vitest.log; then echo "interop test skipped" >&2; exit 1; fi
  setup-page:
    needs: [changes]
    if: needs.changes.outputs.provisioning == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/setup-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/setup-page/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build and test the exact shipped page (QR round-trip via jsQR)
        run: npm test
      - run: cat dist/SHA256SUMS
  mobile:
    needs: [changes, bins]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - name: BLE transport against Rust device core (must not skip)
        working-directory: apps/mobile
        shell: bash
        env:
          T3BOX_PROVISION_BIN: ${{ github.workspace }}/ci-bins/t3box-provision
        run: |
          npx vitest run --reporter=verbose | tee vitest.log
          grep -q 'BlePlxTransport against Rust device core' vitest.log
          if grep -qiE 'skipped|↓' vitest.log; then echo "device-core test skipped" >&2; exit 1; fi
      - name: Metro bundle for iOS and Android
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/t3box-export"
  # Native module (modules/t3box-pinned-fetch), Android side. Android is
  # paused: the iOS app is the supported client for now, so this job runs
  # only when started by hand.
  mobile-android:
    needs: [changes, bins]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/modules/**/build.gradle') }}
          restore-keys: gradle-mobile-
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Pinned client unit tests (device PKI) and debug APK
        run: bash ci/mobile-android.sh ci-bins
  mobile-ios-trust:
    needs: changes
    if: needs.changes.outputs.mobile_native == 'true' && github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PinnedTrust against device-PKI fixtures (Security.framework)
        working-directory: apps/mobile/modules/t3box-pinned-fetch/ios/PinnedTrust
        run: swift test 2>&1 | tee swift-test.log; grep -q "Test Suite 'All tests' passed" swift-test.log
  # iOS camera sender core (modules/t3box-camera/ios/CameraSender): real
  # libwebrtc on macOS, synthetic frames, in-process receiver restricted
  # like t3box-phone. The produced offer is then fed to the real
  # t3box-phone on Linux (phone-ios-offer).
  mobile-ios-camera:
    needs: changes
    if: (needs.changes.outputs.mobile_native == 'true' || needs.changes.outputs.phone == 'true') && github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/mobile/modules/t3box-camera/ios/CameraSender/.build
          key: camera-sender-${{ runner.os }}-${{ hashFiles('apps/mobile/modules/t3box-camera/ios/CameraSender/Package.swift') }}
      - name: Sender core against libwebrtc (H.264 baseline, dual tracks, live plans)
        working-directory: apps/mobile/modules/t3box-camera/ios/CameraSender
        env:
          T3BOX_OFFER_OUT: ${{ runner.temp }}/ios-offer.json
        run: |
          swift test 2>&1 | tee swift-test.log
          grep -q "Test Suite 'All tests' passed" swift-test.log
          ! grep -E "skipped" swift-test.log
          test -s "$T3BOX_OFFER_OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-offer
          path: ${{ runner.temp }}/ios-offer.json
          retention-days: 3
  phone-ios-offer:
    needs: [changes, bins, mobile-ios-camera]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - uses: actions/download-artifact@v4
        with:
          name: ios-offer
      - run: tar -xf ci-bins.tar
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: services/control
          bundler-cache: true
      - name: libwebrtc offer from the iOS sender accepted by t3box-phone
        run: tests/phone/ios-offer.sh ci-bins ios-offer.json
  ble-e2e:
    needs: changes
    if: needs.changes.outputs.ble == 'true'
    # Real BlueZ stack with two virtual LE controllers (hci_vhci + btvirt).
    # One fresh VM per variant: btvirt sessions leave BlueZ/kernel state
    # behind that a second session on the same host can trip over.
    strategy:
      fail-fast: false
      matrix:
        mode: ['', '--min-mtu']
    name: ble-e2e ${{ matrix.mode || 'negotiated-mtu' }}
    # ARM64 hosted runners: the x64 pool mixes kernel flavours, some of which
    # ship no hci_vhci module at all.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bluez bluez-test-tools libdbus-1-dev pkg-config >/dev/null
      - run: sudo pip3 install --break-system-packages -q bleak==3.1.0 cryptography
      # Host build (bluer needs libdbus): main's target directory, saved
      # only from main so PRs never pin a stale one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ble-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build device core and BLE adapter
        run: |
          cargo build --locked --no-default-features --features ci-virtual --bin t3box-provision
          cargo build --locked -p t3box-ble
          cargo test --locked -p t3box-ble
          cargo clippy --locked -p t3box-ble -- -D warnings
      - name: Kernel support for virtual Bluetooth controllers
        run: |
          uname -r
          sudo modprobe hci_vhci || sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
          sudo modprobe hci_vhci && ls -l /dev/vhci
      - name: BLE end-to-end v2 (claim/scan/join, bluetoothd restart self-heal)
        run: BLE_E2E_LOGS=$RUNNER_TEMP tests/ble/run-e2e.sh target/debug ${{ matrix.mode }}
  wifi-nm-e2e:
    needs: [changes, bins]
    if: needs.changes.outputs.wifi == 'true'
    # Real NetworkManager over D-Bus on virtual radios (mac80211_hwsim):
    # hostapd WPA2 AP + dnsmasq on wlan1, NetworkManager on wlan0 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq network-manager hostapd dnsmasq-base iw >/dev/null
      - run: sudo pip3 install --break-system-packages -q cryptography
      - uses: actions/download-artifact@v4
        with:
          name: ci-bins-x64
      - run: tar -xf ci-bins.tar && ls -la ci-bins
      - name: Wi-Fi join, PSK persistence and auto-reconnect via NetworkManager
        run: NM_E2E_LOGS=$RUNNER_TEMP tests/wifi/run-nm-e2e.sh ci-bins
