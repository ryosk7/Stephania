name: TestFlight
# Builds Stephania Connect for the App Store and uploads it to TestFlight.
# Run it from the Actions tab on main, or push a tag connect-v<version> on a
# commit of main. The job runs in the protected environment `testflight`
# (required reviewer; deployment refs main and connect-v* tags) and needs,
# as secrets of that environment (or of the repository):
#   ASC_KEY_ID, ASC_ISSUER_ID  App Store Connect API key (App Manager)
#   ASC_KEY_P8                 contents of the AuthKey_<id>.p8 file
#   APPLE_TEAM_ID              the Apple Developer team id
# and an app record for dev.ryosk7.stephania.connect in App Store Connect.
# Signing is automatic: Xcode creates or reuses the distribution
# certificate and profile through the API key.
# The secrets reach only the steps that need them: npm ci and expo prebuild
# (dependency code) run before the API key exists on disk.
on:
  workflow_dispatch:
  push:
    tags: ['connect-v*']
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  upload:
    # Only main or a connect-v* tag; the tag is checked to be on main below.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/connect-v')
    # Expo SDK 58 needs a current Xcode 26 (see mobile-ios-build.yml).
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ref is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "::error::$GITHUB_REF is not on main"; exit 1; }
      - name: Secrets present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ "${!v}" = true ] || { echo "::error::Missing secret $v (see the header of .github/workflows/testflight.yml)"; exit 1; }
          done
      # No `cache:` input: setup-node v4 then restores no npm cache, which
      # other workflows could have written.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: packages/provisioning-client
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" >"$RUNNER_TEMP/asc/AuthKey.p8")
      - name: Archive (Release, automatic signing)
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Every upload needs a new build number; the version comes from app.json.
          xcrun agvtool new-version -all "$BUILD_NUMBER" >/dev/null
          xcodebuild -workspace StephaniaConnect.xcworkspace -scheme StephaniaConnect -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Connect.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic archive | tail -40
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat >"$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Connect.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded build $BUILD_NUMBER; it appears in TestFlight after Apple's processing." >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
