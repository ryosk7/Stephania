name: Publish setup page
# Publishes tools/setup-page to GitHub Pages (https://ryosk7.github.io/Stephania/).
# Deploys on every change to the page on main.
# Requires Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - tools/setup-page/**
      - .github/workflows/setup-page-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: setup-page-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: tools/setup-page
        run: |
          npm ci --no-audit --no-fund
          npm test
          rm dist/script.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/setup-page/dist
      - id: deployment
        uses: actions/deploy-pages@v4
