name: Physical Raspberry Pi native acceptance
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Physical stream duration in seconds (120 or 10800)
        type: choice
        options: ["120", "10800"]
        default: "120"
permissions:
  contents: read
jobs:
  pi5-hardware:
    runs-on: [self-hosted, Linux, ARM64, stephania-pi5]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -qi 'Raspberry Pi 5' /proc/device-tree/model
          uname -m | grep -Eq 'aarch64|arm64'
          ls -l /dev/video*
          arecord -l
      - run: cargo build --release --locked --all-features --bin stephania
      - run: LAB_INPUT=physical LAB_SECONDS=${{ inputs.seconds }} bash tests/virtual-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-native-evidence
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.log
