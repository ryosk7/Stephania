name: Generate native capture lockfile
on:
  push:
    branches: [feat/native-capture-worker]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile and print base64
        run: |
          cargo generate-lockfile
          echo 'BEGIN_T3BOX_CAPTURE_LOCK'
          base64 -w0 Cargo.lock
          echo
          echo 'END_T3BOX_CAPTURE_LOCK'
