name: Probe virtual radios (temporary)
on:
  push:
    branches: [feature/ble-adapter]
    paths: ['.github/workflows/probe-radios.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          set -x
          uname -a
          sudo modprobe hci_vhci && ls -l /dev/vhci || echo "NO_VHCI"
          sudo modprobe mac80211_hwsim radios=2 && iw dev || echo "NO_HWSIM"
          ls /sys/class/ieee80211 || true
          apt-cache policy bluez bluez-tests bluez-test-tools hostapd network-manager | grep -E "^[a-z]|Candidate"
          sudo apt-get update -qq && sudo apt-get install -y -qq bluez bluez-tests >/dev/null 2>&1; dpkg -L bluez-tests 2>/dev/null | grep -E "btvirt|bin/" | head
          which btvirt btmgmt bluetoothctl || true
          systemctl status bluetooth --no-pager | head -5 || true
          sudo btmgmt info || true
