name: stephctl
# The maintenance CLI builds and passes its tests on macOS and Windows too
# (Linux is covered by rust-check and ci/stephctl-e2e.sh).
on:
  pull_request:
    paths:
      - tools/stephctl/**
      - Cargo.lock
      - .github/workflows/stephctl.yml
  push:
    branches: [main]
    paths:
      - tools/stephctl/**
      - Cargo.lock
      - .github/workflows/stephctl.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stephctl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p stephctl
      - run: cargo clippy --locked -p stephctl --all-targets -- -D warnings
