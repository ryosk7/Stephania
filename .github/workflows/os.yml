name: OS and updates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      os: ${{ steps.c.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/changes.py

  # Real RAUC (verity bundles, X.509 signatures, pre-install handler) on
  # loop devices; the Pi 5 tryboot firmware rule is emulated. Hardware
  # tryboot behaviour remains a physical qualification item.
  ab-update-e2e:
    needs: changes
    if: needs.changes.outputs.os == 'true'
    # 22.04: its kernel reports dm-verity status as 'V'; kernels >= 6.19
    # append an FEC field ('V -') that RAUC v1.15 rejects (see docs/UPDATE.md).
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Host build (22.04 glibc); main's target directory only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bootctl-2204
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 squashfs-tools dosfstools meson ninja-build pkg-config \
            libglib2.0-dev libssl-dev libcurl4-openssl-dev libjson-glib-dev libnl-genl-3-dev libdbus-1-dev libfdisk-dev >/dev/null
      # RAUC v1.15 pinned and built from source once (installs its own
      # D-Bus policy). Units in systemd/ are verified by studio.yml.
      - uses: actions/cache@v4
        id: rauc
        with:
          path: /tmp/rauc
          key: rauc-v1.15-ubuntu-22.04-${{ runner.arch }}
      - name: Build RAUC v1.15
        if: steps.rauc.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch v1.15 https://github.com/rauc/rauc /tmp/rauc
          git -C /tmp/rauc log -1 --format='RAUC source %H'
          meson setup /tmp/rauc/build /tmp/rauc --prefix=/usr >/tmp/rauc-meson.log || { cat /tmp/rauc-meson.log; exit 1; }
          ninja -C /tmp/rauc/build >/dev/null
      - name: Install RAUC
        run: |
          sudo ninja -C /tmp/rauc/build install >/dev/null
          sudo systemctl reload dbus || sudo systemctl restart dbus
          rauc --version
      - run: cargo build --locked --no-default-features --bin stephania-bootctl
      - name: A/B update end to end (verity bundles)
        run: sudo env PATH="$PATH" ci/update-e2e.sh target/debug/stephania-bootctl

  # PR image check: the same image recipe for x86_64, booted with KVM
  # (seconds instead of minutes of arm64 emulation), with binaries built
  # for Debian trixie like the image (ci/build-device-bins.sh). One job
  # builds the image and the installer; the checks run in parallel jobs on
  # the packed result, so every job stays within about three minutes.
  image-qemu-x64:
    needs: changes
    if: needs.changes.outputs.os == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Host packages install in the background while the binaries build.
      - name: Host packages (background)
        run: |
          nohup bash -c 'sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq &&
            sudo apt-get install -y -qq gnupg mmdebstrap squashfs-tools dosfstools mtools fdisk e2fsprogs zip unzip cpio zstd >/dev/null &&
            touch /tmp/apt.ok' >/tmp/apt.log 2>&1 &
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: x64-device-bins
          image: device-build
          command: ci/build-device-bins.sh device-bins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Build Studio
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: image-apt-amd64-${{ hashFiles('os/image/build.sh') }}-${{ github.run_id }}
          restore-keys: image-apt-amd64-${{ hashFiles('os/image/build.sh') }}-
      - name: Wait for host packages
        run: |
          for _ in $(seq 1 240); do [ -f /tmp/apt.ok ] && break; sleep 1; done
          [ -f /tmp/apt.ok ] || { cat /tmp/apt.log; exit 1; }
          # trixie keys: the runner's debian-archive-keyring predates them.
          docker run --rm debian:trixie cat /usr/share/keyrings/debian-archive-keyring.gpg >"$RUNNER_TEMP/debian-archive-keyring.gpg"
          echo "STEPHANIA_IMAGE_DEBIAN_KEYRING=$RUNNER_TEMP/debian-archive-keyring.gpg" >>"$GITHUB_ENV"
      - name: Ephemeral release keys (CI only; releases use repository secrets)
        run: bash os/release/test-keys.sh "$RUNNER_TEMP/keys"
      - name: Build image (amd64)
        run: |
          sudo env STEPHANIA_IMAGE_DEBIAN_KEYRING="$STEPHANIA_IMAGE_DEBIAN_KEYRING" STEPHANIA_IMAGE_VERSION="ci-${GITHUB_SHA::12}" STEPHANIA_IMAGE_ARCH=amd64 STEPHANIA_RAUC_KEYRING="$RUNNER_TEMP/keys/rauc-ca.pem" \
            STEPHANIA_IMAGE_APT_CACHE="$RUNNER_TEMP/apt-archives" os/image/build.sh "$RUNNER_TEMP/image" device-bins
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/apt-archives"
      - name: Build the installer ZIP (ephemeral signing key)
        run: |
          sudo env STEPHANIA_IMAGE_DEBIAN_KEYRING="$STEPHANIA_IMAGE_DEBIAN_KEYRING" STEPHANIA_IMAGE_VERSION="ci-${GITHUB_SHA::12}" STEPHANIA_IMAGE_ARCH=amd64 STEPHANIA_INSTALL_SIGNING_KEY="$RUNNER_TEMP/keys/release-signing.pem" \
            os/installer/build.sh "$RUNNER_TEMP/image" "$RUNNER_TEMP/installer"
      - name: Pack for the checks
        run: |
          cd "$RUNNER_TEMP"
          sudo tar --sparse -cf - image/stephania.img image/vmlinuz image/initrd.img image/rootfs.squashfs image/boot-a.vfat image/dpkg.tsv \
            image/rootfs/usr/share/doc installer/zip installer/stephania-os.zip keys | zstd -q -T0 -1 -o "$GITHUB_WORKSPACE/x64.tar.zst"
          ls -la "$GITHUB_WORKSPACE/x64.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: image-x64
          path: x64.tar.zst
          compression-level: 0
          retention-days: 1

  # Checks on the x86_64 image, in parallel: boot it; the RAM installer
  # (refusals, power cuts with resume, the installed card booting); and the
  # release artifacts assembled and verified with the ephemeral keys.
  image-qemu-x64-check:
    needs: image-qemu-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [boot, installer-refuse, installer-staged, installer-written, release]
    name: image-qemu-x64 (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v4
      - name: Host packages (background)
        run: |
          pkgs="qemu-system-x86 dosfstools mtools fdisk zstd"
          [ "${{ matrix.check }}" = release ] && pkgs="rauc xz-utils unzip zstd"
          nohup bash -c "sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $pkgs >/dev/null && touch /tmp/apt.ok" >/tmp/apt.log 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: image-x64
      - name: Unpack
        run: |
          for _ in $(seq 1 120); do command -v zstd >/dev/null && break; sleep 1; done
          zstd -q -d -c x64.tar.zst | sudo tar --sparse -xf - -C "$RUNNER_TEMP" && rm x64.tar.zst
          for _ in $(seq 1 240); do [ -f /tmp/apt.ok ] && break; sleep 1; done
          [ -f /tmp/apt.ok ] || { cat /tmp/apt.log; exit 1; }
          if [ "${{ matrix.check }}" != release ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Boot with KVM and run the smoke test
        if: matrix.check == 'boot'
        run: sudo ci/qemu-smoke.sh "$RUNNER_TEMP/image" amd64
      - name: Installer end-to-end
        if: startsWith(matrix.check, 'installer-')
        run: sudo ci/installer-e2e.sh "$RUNNER_TEMP/image" "$RUNNER_TEMP/installer" "${{ matrix.check }}"
      # The SBOM lists Studio's npm packages from its installed tree.
      - uses: actions/setup-node@v4
        if: matrix.check == 'release'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - if: matrix.check == 'release'
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Assemble and verify release artifacts (ephemeral keys)
        if: matrix.check == 'release'
        run: |
          # The raw image is compressed at level 1 here; releases use 9.
          env STEPHANIA_RELEASE_VERSION="ci-${GITHUB_SHA::12}" STEPHANIA_RELEASE_NAME=stephania-os-qemu STEPHANIA_RELEASE_XZ_LEVEL=1 \
            STEPHANIA_RELEASE_SIGNING_KEY="$RUNNER_TEMP/keys/release-signing.pem" \
            STEPHANIA_RAUC_CERT="$RUNNER_TEMP/keys/rauc-signing.pem" STEPHANIA_RAUC_KEY="$RUNNER_TEMP/keys/rauc-signing.key" \
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            os/release/assemble.sh "$RUNNER_TEMP/image" "$RUNNER_TEMP/installer" "$RUNNER_TEMP/dist"
          openssl pkey -in "$RUNNER_TEMP/keys/release-signing.pem" -pubout -out "$RUNNER_TEMP/keys/release-signing.pub"
          os/release/verify.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/keys/release-signing.pub" "$RUNNER_TEMP/keys/rauc-ca.pem"
      - if: always() && matrix.check == 'boot'
        uses: actions/upload-artifact@v4
        with:
          name: image-qemu-x64-serial
          path: ${{ runner.temp }}/image/serial.log
          retention-days: 7

  # The real target architecture: arm64 image with the release engine (all
  # native features), booted under QEMU emulation. Minutes, so main and
  # nightly only; PRs run image-qemu-x64. Pi firmware, VideoCore and
  # radios are not emulated (docs/QUALIFICATION.md).
  image-qemu:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-image
          image: device-build
          command: cargo build --release --locked --bin stephania --bin stephania-provision --bin stephania-pki --bin stephania-bootctl && cargo build --release --locked -p stephania-phone
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Build Studio
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund && npm run build
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg curl mmdebstrap qemu-system-arm squashfs-tools dosfstools mtools fdisk e2fsprogs >/dev/null
          # trixie keys: the runner's debian-archive-keyring predates them.
          docker run --rm debian:trixie cat /usr/share/keyrings/debian-archive-keyring.gpg >"$RUNNER_TEMP/debian-archive-keyring.gpg"
          echo "STEPHANIA_IMAGE_DEBIAN_KEYRING=$RUNNER_TEMP/debian-archive-keyring.gpg" >>"$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: image-apt-arm64-${{ hashFiles('os/image/build.sh') }}-${{ github.run_id }}
          restore-keys: image-apt-arm64-${{ hashFiles('os/image/build.sh') }}-
      - name: Build image
        run: |
          sudo env STEPHANIA_IMAGE_DEBIAN_KEYRING="$STEPHANIA_IMAGE_DEBIAN_KEYRING" STEPHANIA_IMAGE_VERSION="ci-${GITHUB_SHA::12}" STEPHANIA_IMAGE_APT_CACHE="$RUNNER_TEMP/apt-archives" \
            os/image/build.sh "$RUNNER_TEMP/image" target/release
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/apt-archives"
      - name: Boot in QEMU and run the smoke test
        run: sudo ci/qemu-smoke.sh "$RUNNER_TEMP/image" arm64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-qemu-serial
          path: ${{ runner.temp }}/image/serial.log
          retention-days: 7

  # Raspberry Pi 5 variant (linux-image-raspi, DTB, overlays). It cannot boot
  # in QEMU; structure only (ci/pi-image-check.sh). Booting it is Q-BOOT in
  # docs/QUALIFICATION.md.
  image-pi:
    needs: changes
    # Also on PRs that touch the OS: the Pi variant is the product, and its
    # package sources (Raspberry Pi archive) differ from the QEMU image.
    if: github.event_name != 'pull_request' || needs.changes.outputs.os == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-image
          image: device-build
          command: cargo build --release --locked --bin stephania --bin stephania-provision --bin stephania-pki --bin stephania-bootctl && cargo build --release --locked -p stephania-phone
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Studio
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund && npm run build
      - run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg curl mmdebstrap squashfs-tools dosfstools mtools fdisk e2fsprogs >/dev/null
          # trixie keys: the runner's debian-archive-keyring predates them.
          docker run --rm debian:trixie cat /usr/share/keyrings/debian-archive-keyring.gpg >"$RUNNER_TEMP/debian-archive-keyring.gpg"
          echo "STEPHANIA_IMAGE_DEBIAN_KEYRING=$RUNNER_TEMP/debian-archive-keyring.gpg" >>"$GITHUB_ENV"
      - name: Build the Pi image
        run: sudo env STEPHANIA_IMAGE_DEBIAN_KEYRING="$STEPHANIA_IMAGE_DEBIAN_KEYRING" STEPHANIA_IMAGE_VERSION="ci-${GITHUB_SHA::12}" STEPHANIA_IMAGE_VARIANT=pi os/image/build.sh "$RUNNER_TEMP/image" target/release
      - name: Check the boot slots
        run: ci/pi-image-check.sh "$RUNNER_TEMP/image"
