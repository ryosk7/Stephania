name: OS and updates
on:
  push:
    branches: [main]
    paths: ['os/**', 'src/bootctl.rs', 'src/bin/t3box-bootctl.rs', 'src/ipc.rs', 'ci/update-e2e.sh', 'ci/fake_engine.py', 'systemd/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/os.yml']
  pull_request:
    paths: ['os/**', 'src/bootctl.rs', 'src/bin/t3box-bootctl.rs', 'src/ipc.rs', 'ci/update-e2e.sh', 'ci/fake_engine.py', 'systemd/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/os.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Real RAUC (verity bundles, X.509 signatures, pre-install handler) on
  # loop devices; the Pi 5 tryboot firmware rule is emulated. Hardware
  # tryboot behaviour remains a physical qualification item.
  ab-update-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: os-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # Ubuntu 24.04's RAUC 1.11 rejects verity bundles on the runner's newer
      # kernel ("Unexpected dm-verity status 'V -'"), fixed upstream; build a
      # pinned release. rauc-service from apt only supplies the D-Bus policy.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rauc-service squashfs-tools dosfstools meson ninja-build pkg-config \
            libglib2.0-dev libssl-dev libcurl4-openssl-dev libjson-glib-dev libnl-genl-3-dev libdbus-1-dev libfdisk-dev systemd-dev >/dev/null
      - name: Build RAUC v1.15
        run: |
          git clone -q --depth 1 --branch v1.15 https://github.com/rauc/rauc /tmp/rauc
          git -C /tmp/rauc log -1 --format='RAUC source %H'
          meson setup /tmp/rauc/build /tmp/rauc --prefix=/usr/local >/tmp/rauc-meson.log || { cat /tmp/rauc-meson.log; exit 1; }
          ninja -C /tmp/rauc/build >/dev/null
          sudo install -m 0755 /tmp/rauc/build/rauc /usr/local/bin/rauc
          /usr/local/bin/rauc --version
      - name: Boot-control unit tests
        run: cargo test --locked --no-default-features --lib bootctl
      - run: cargo build --locked --no-default-features --bin t3box-bootctl
      - name: A/B update end to end (verity bundles)
        run: sudo env PATH="$PATH" ci/update-e2e.sh target/debug/t3box-bootctl
      - name: Validate update units
        run: systemd-analyze verify "$PWD/systemd/t3box-update-confirm.service" 2>&1 | { grep -vE 'is not executable|No such file' || true; } | tee /tmp/verify.txt; test ! -s /tmp/verify.txt
