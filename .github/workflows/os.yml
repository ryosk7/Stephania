name: OS and updates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      os: ${{ steps.c.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/changes.py

  # Real RAUC (verity bundles, X.509 signatures, pre-install handler) on
  # loop devices; the Pi 5 tryboot firmware rule is emulated. Hardware
  # tryboot behaviour remains a physical qualification item.
  ab-update-e2e:
    needs: changes
    if: needs.changes.outputs.os == 'true'
    # 22.04: its kernel reports dm-verity status as 'V'; kernels >= 6.19
    # append an FEC field ('V -') that RAUC v1.15 rejects (see docs/UPDATE.md).
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Host build (22.04 glibc); main's target directory only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bootctl-2204
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 squashfs-tools dosfstools meson ninja-build pkg-config \
            libglib2.0-dev libssl-dev libcurl4-openssl-dev libjson-glib-dev libnl-genl-3-dev libdbus-1-dev libfdisk-dev >/dev/null
      # RAUC v1.15 pinned and built from source once (installs its own
      # D-Bus policy). Units in systemd/ are verified by studio.yml.
      - uses: actions/cache@v4
        id: rauc
        with:
          path: /tmp/rauc
          key: rauc-v1.15-ubuntu-22.04-${{ runner.arch }}
      - name: Build RAUC v1.15
        if: steps.rauc.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch v1.15 https://github.com/rauc/rauc /tmp/rauc
          git -C /tmp/rauc log -1 --format='RAUC source %H'
          meson setup /tmp/rauc/build /tmp/rauc --prefix=/usr >/tmp/rauc-meson.log || { cat /tmp/rauc-meson.log; exit 1; }
          ninja -C /tmp/rauc/build >/dev/null
      - name: Install RAUC
        run: |
          sudo ninja -C /tmp/rauc/build install >/dev/null
          sudo systemctl reload dbus || sudo systemctl restart dbus
          rauc --version
      - run: cargo build --locked --no-default-features --bin t3box-bootctl
      - name: A/B update end to end (verity bundles)
        run: sudo env PATH="$PATH" ci/update-e2e.sh target/debug/t3box-bootctl

  # PR image check: the same image recipe for x86_64, booted with KVM
  # (seconds instead of minutes of arm64 emulation), using the shared
  # x64-bins build (ci/build-bins.sh).
  image-qemu-x64:
    needs: changes
    if: needs.changes.outputs.os == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: x64-bins
          command: ci/build-bins.sh ci-bins
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Build Studio
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund && npm run build
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap qemu-system-x86 squashfs-tools dosfstools mtools fdisk e2fsprogs >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: image-apt-amd64-${{ hashFiles('os/image/build.sh') }}-${{ github.run_id }}
          restore-keys: image-apt-amd64-${{ hashFiles('os/image/build.sh') }}-
      - name: Build image (amd64)
        run: |
          sudo env T3BOX_IMAGE_VERSION="ci-${GITHUB_SHA::12}" T3BOX_IMAGE_ARCH=amd64 \
            T3BOX_IMAGE_APT_CACHE="$RUNNER_TEMP/apt-archives" os/image/build.sh "$RUNNER_TEMP/image" ci-bins
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/apt-archives"
      - name: Boot with KVM and run the smoke test
        run: sudo ci/qemu-smoke.sh "$RUNNER_TEMP/image" amd64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-qemu-x64-serial
          path: ${{ runner.temp }}/image/serial.log
          retention-days: 7

  # The real target architecture: arm64 image with the release engine (all
  # native features), booted under QEMU emulation. Minutes, so main and
  # nightly only; PRs run image-qemu-x64. Pi firmware, VideoCore and
  # radios are not emulated (docs/QUALIFICATION.md).
  image-qemu:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate read-only GHCR access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: ./.github/actions/cached-build
        with:
          profile: arm64-image
          command: cargo build --release --locked --bin t3box --bin t3box-provision --bin t3box-pki --bin t3box-bootctl && cargo build --release --locked -p t3box-phone
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Build Studio
        working-directory: apps/studio
        run: npm ci --no-audit --no-fund && npm run build
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap qemu-system-arm squashfs-tools dosfstools mtools fdisk e2fsprogs >/dev/null
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: image-apt-arm64-${{ hashFiles('os/image/build.sh') }}-${{ github.run_id }}
          restore-keys: image-apt-arm64-${{ hashFiles('os/image/build.sh') }}-
      - name: Build image
        run: |
          sudo env T3BOX_IMAGE_VERSION="ci-${GITHUB_SHA::12}" T3BOX_IMAGE_APT_CACHE="$RUNNER_TEMP/apt-archives" \
            os/image/build.sh "$RUNNER_TEMP/image" target/release
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/apt-archives"
      - name: Boot in QEMU and run the smoke test
        run: sudo ci/qemu-smoke.sh "$RUNNER_TEMP/image" arm64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-qemu-serial
          path: ${{ runner.temp }}/image/serial.log
          retention-days: 7
