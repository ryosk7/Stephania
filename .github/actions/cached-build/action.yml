name: Generic cached build environment
description: >-
  Compile inside the generic GHCR build image with a warm Cargo registry,
  sccache and target directory. Caches are keyed by `profile` (shared by
  every job that builds the same way), restored everywhere and saved only
  from main, so pull requests start from main's build and recompile only
  what they changed (ci/README.md).
inputs:
  command:
    description: Cargo commands to execute
    required: true
  profile:
    description: Cache profile shared by jobs with compatible builds
    required: false
    default: default
  image:
    description: Build image recipe in ci/images (build = Ubuntu 24.04 test environment, device-build = Debian trixie like the device)
    required: false
    default: build
  cache:
    description: >-
      `shared` restores (and on main saves) the profile's cache; `none`
      neither restores nor saves, so the build starts from a clean target
      directory. Release builds use `none`: they must not trust cache
      entries that other workflows wrote.
    required: false
    default: shared
  local-image:
    description: >-
      `true` builds the image from its committed recipe instead of pulling
      the mutable registry tag (release builds).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        RECIPE_HASH: ${{ hashFiles(format('ci/images/{0}.Dockerfile', inputs.image), 'Cargo.lock') }}
        CACHE_MODE: ${{ inputs.cache }}
      run: |
        case "$CACHE_MODE" in shared|none) ;; *) echo "::error::cache must be shared or none, not $CACHE_MODE"; exit 1;; esac
        echo "prefix=rust-${RUNNER_ARCH}-${PROFILE}-${RECIPE_HASH}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: inputs.cache == 'shared'
      id: restore
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/stephania-sccache
          target
        key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}-
    - shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.command }}
        BUILD_IMAGE: ${{ inputs.image }}
        CACHE_MATCHED: ${{ steps.restore.outputs.cache-matched-key || 'cold' }}
        STEPHANIA_CI_IMAGE_LOCAL: ${{ inputs.local-image == 'true' && '1' || '' }}
      run: |
        set -Eeuo pipefail
        start=$SECONDS
        ref="$(bash ci/images/pull.sh "$BUILD_IMAGE")"
        echo "Build image preparation: $((SECONDS-start))s (cache: $CACHE_MATCHED)" >> "$GITHUB_STEP_SUMMARY"
        start=$SECONDS
        mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/stephania-sccache" target
        docker run --rm --user "$(id -u):$(id -g)" \
          -e HOME=/tmp -e CARGO_HOME=/cargo -e RUSTC_WRAPPER=sccache -e SCCACHE_DIR=/sccache -e SCCACHE_CACHE_SIZE=1G \
          -e CARGO_INCREMENTAL=0 \
          -v "$HOME/.cargo/registry:/cargo/registry" -v "$HOME/.cargo/git:/cargo/git" \
          -v "$HOME/.cache/stephania-sccache:/sccache" \
          -v "$PWD:/work" -w /work "$ref" bash -Eeuo pipefail -c 'trap "sccache --show-stats" EXIT; eval "$1"' _ "$BUILD_COMMAND"
        echo "Build/test command: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
    # Only main writes caches: PR builds never evict main's warm state.
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: inputs.cache == 'shared' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/stephania-sccache
          target
        key: ${{ steps.key.outputs.prefix }}-${{ github.sha }}
