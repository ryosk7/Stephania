# RAUC system configuration for the Stephania reference image
# (install as /etc/rauc/system.conf). Layout and rationale: docs/UPDATE.md.
[system]
compatible=stephania-pi5
bootloader=custom
# Plain bundles are not accepted; verity bundles are verified block-wise.
bundle-formats=-plain
data-directory=/data/stephania/rauc

[keyring]
# Release CA certificate only (never a private key). Provisioned by the
# image build from the release signing infrastructure.
path=/etc/rauc/keyring.pem
# Release signing certificates carry extendedKeyUsage=codeSigning.
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/local/bin/stephania-bootctl
pre-install=/usr/local/lib/stephania/rauc-pre-install

# GPT: p1 boot selector (autoboot.txt), p2/p3 boot A/B, p4/p5 root A/B,
# p6 persistent data. The firmware boots partition numbers, so bootnames
# map to the boot partitions (STEPHANIA_BOOT_SLOTS=A=2,B=3).
[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=raw
bootname=B

[slot.boot.0]
device=/dev/disk/by-partlabel/boot-a
type=raw
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot-b
type=raw
parent=rootfs.1
