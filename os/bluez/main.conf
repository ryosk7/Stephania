# BlueZ configuration for the T3Box appliance (install as
# /etc/bluetooth/main.conf). Chosen to avoid common BlueZ failure modes;
# see contracts/ble-protocol.md "BlueZ robustness".
[General]
# LE only: no BR/EDR profiles, inquiry or classic pairing paths.
ControllerMode = le
Name = T3Box
# Never time out discoverability; advertising is controlled by t3box-ble.
DiscoverableTimeout = 0
# No pairing is required by the protocol; if a phone insists on pairing,
# allow Just Works re-pairing instead of failing on stale bonds.
JustWorksRepairing = always
# Static identity address: stable for phones' GATT caches (no RPA rotation).
Privacy = off

[GATT]
# Largest MTU the controller allows; the protocol works down to 23.
ExchangeMTU = 517
# Server role only; do not cache remote databases.
Cache = no

[Policy]
# Bring the controller up at boot and after resets.
AutoEnable = true
