# Install as /etc/systemd/system.conf.d/10-t3box-watchdog.conf.
# The Pi 5 hardware watchdog (bcm2835-wdt, enabled by dtparam=watchdog=on in
# config.txt) resets the board if PID 1 stops servicing it. During an update
# trial that reset is a normal boot, so the firmware returns to the
# committed slot (docs/UPDATE.md). Values are a starting point, not
# qualified (docs/QUALIFICATION.md Q-BOOT).
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
