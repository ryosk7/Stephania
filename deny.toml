# Supply-chain policy for the Rust workspace (docs/LICENSING.md).
# CI: `cargo deny --all-features check` (studio.yml: audit).

[graph]
all-features = true

[advisories]
# RustSec advisories are errors; unmaintained crates are reported for
# workspace dependencies only (transitive ones are tracked in review).
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with shipping the engine as part of a
# GPL-2.0-or-later combined work (it links libx264).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
