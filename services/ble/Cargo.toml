[package]
name = "stephania-ble"
version = "0.1.0"
edition = "2021"
description = "BlueZ GATT adapter for Stephania provisioning (forwards to stephania-provision)"
license = "MIT"

[dependencies]
stephania = { path = "../..", default-features = false }
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures = "0.3"
serde_json = "1"
uuid = "1"
