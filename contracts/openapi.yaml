openapi: 3.1.0
info:
  title: Stephania Control API
  version: 0.1.0
  description: |
    Management plane served by services/control (Sinatra). Plain HTTP is
    loopback-only (bootstrap token). On the LAN it is served only over TLS
    with the device-CA certificate (port 9443), Host must be a certified
    device name/address, cross-origin requests are rejected, and only
    owner-issued tokens (BLE management.enroll) are accepted. No media
    passes through this API. Only the operations below are
    implemented; the full target surface is in docs/MASTER-ARCHITECTURE.md §18.
servers:
  - url: http://127.0.0.1:9292/api/v1
  - url: https://{device}.local:9443/api/v1
    variables:
      device: {default: stephania}
security:
  - bearer: []
  - session: []
paths:
  /capabilities:
    get:
      summary: Management-plane feature flags
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [scene_drafts, program_apply, phone_camera, audio_mixer, accounts, engine_reachable]
                properties:
                  scene_drafts: {type: boolean}
                  program_apply: {type: boolean, description: Engine reports frame-boundary scene.apply support}
                  phone_camera: {type: boolean}
                  audio_mixer: {type: boolean}
                  accounts: {type: boolean}
                  engine_reachable: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /auth/session:
    post:
      summary: Sign in with a Studio account (sets the session cookie)
      security: []
      description: |
        Sets `stephania_session` (HttpOnly, SameSite=Strict, Secure over TLS,
        Path=/api/). Cookie-authenticated state-changing requests must send
        the returned csrf_token as X-CSRF-Token. 5 failures per username or
        client address lock for 60 s (doubling, max 15 min): 429 with
        Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, expires_at_unix]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token: {type: string}
                  expires_at_unix: {type: integer}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Sign out (ends this session; no-op for bearer tokens)
      responses:
        "204": {description: Signed out}
        default: {$ref: "#/components/responses/Error"}
  /auth/me:
    get:
      summary: Current principal
      responses:
        "200":
          description: Owner (bearer token) or signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [kind, role]
                properties:
                  kind: {enum: [owner, user]}
                  role: {$ref: "#/components/schemas/Role"}
                  username: {type: string}
                  user_id: {type: integer}
                  csrf_token: {type: string}
                  expires_at_unix: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /auth/password:
    put:
      summary: Change the signed-in user's password (other sessions end)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 10, maxLength: 256}
      responses:
        "204": {description: Changed}
        default: {$ref: "#/components/responses/Error"}
  /users:
    get:
      summary: List accounts (admin)
      responses:
        "200": {description: Accounts, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/User"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create an account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, role]
              properties:
                username: {type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,31}$"}
                password: {type: string, minLength: 10, maxLength: 256}
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        default: {$ref: "#/components/responses/Error"}
  /users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    patch:
      summary: Change role, disable, or reset password (admin; ends the user's sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                role: {$ref: "#/components/schemas/Role"}
                disabled: {type: boolean}
                password: {type: string, minLength: 10, maxLength: 256}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete an account (admin). The last enabled admin cannot be removed (409 last_admin).
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /status:
    get:
      summary: Engine status (IPC engine.status)
      responses:
        "200":
          description: |
            Engine status (ipc.schema.json#/$defs/engine_status) plus engine_restarted,
            true when instance_id differs from the previous call (clients must re-read
            state). native_worker_running is worker activity, not ingest confirmation.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "ipc.schema.json#/$defs/engine_status"}
                  - type: object
                    required: [engine_restarted]
                    properties: {engine_restarted: {type: boolean}}
        default: {$ref: "#/components/responses/Error"}
  /events:
    get:
      summary: Server-Sent Events stream of device state changes
      description: |
        text/event-stream. The first event is always `snapshot`
        ({engine: engine_status|null, scenes: [{id, revision}]}); clients
        reconcile from it on every (re)connect. Then: engine.connected,
        engine.unavailable, engine.restarted, stream.state_changed
        ({state, streaming_requested, native_worker_running, last_error}),
        program.changed ({scene_id, revision}), audio.levels (~4 Hz while
        streaming: {inputs:[{id,state,levels,muted,gain_db}], master}),
        audio.configured ({inputs}), scene.updated
        ({id, revision}), scene.deleted ({id}),
        maintenance.window_opened / maintenance.root_window_opened
        ({actor, expires_at, root}), maintenance.certificate_issued /
        maintenance.root_certificate_issued ({actor, serial, valid_before,
        client_addr}), maintenance.window_closed ({actor}, when closed
        through the API or by an account change), output.changed
        ({configured}; never the URL or key). Comment lines are
        keepalives (every 15 s). Slow consumers are disconnected. Unknown
        event names must be ignored.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        "429":
          description: Concurrent stream limit (8) reached (error code too_many_streams)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}
  /engine/capabilities:
    get:
      summary: Engine capabilities (IPC engine.capabilities)
      responses:
        "200": {description: Engine capabilities, content: {application/json: {schema: {type: object}}}}
        default: {$ref: "#/components/responses/Error"}
  /stream/start:
    post:
      summary: Request stream start (IPC stream.start)
      description: |
        Sends the destination stored with PUT /output to the engine as
        `stream.start {output}` (engine socket only). With none stored the
        engine uses its own STEPHANIA_OUTPUT (development) and otherwise
        fails with 503 engine_start_failed.
      responses:
        "202":
          description: Request accepted by the engine; not confirmation of ingest.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, streaming_requested, youtube_ingest_confirmed]
                properties:
                  accepted: {const: true}
                  streaming_requested: {const: true}
                  youtube_ingest_confirmed: {const: false}
        default: {$ref: "#/components/responses/Error"}
  /output:
    get:
      summary: Stream destination status (stream key never returned)
      description: |
        Admins get {configured, url, key_last4, updated_at_unix}; operators
        get only {configured}. The stream key itself is never returned by
        any route, event or log.
      responses:
        "200":
          description: Destination status
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/OutputStatus"}
                  - type: object
                    additionalProperties: false
                    required: [configured]
                    properties:
                      configured: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Set or replace the stream destination (admin only)
      description: |
        Stored by control in its state directory on /data (0600, not in
        control.db, so not in update snapshots) and sent to the engine at
        the next stream start; a running stream keeps its destination.
        Only RTMPS is accepted. Operators get 403 forbidden_role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, stream_key]
              properties:
                url:
                  type: string
                  pattern: "^rtmps://[A-Za-z0-9.-]+(:[0-9]{1,5})?/[A-Za-z0-9._~-]{1,128}$"
                  description: Ingest server URL without the key, e.g. rtmps://a.rtmps.youtube.com/live2. DNS name with a dot (no IP literals).
                stream_key:
                  type: string
                  pattern: "^[A-Za-z0-9._~-]{8,256}$"
                  writeOnly: true
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OutputStatus"}
        "422":
          description: invalid_request (body shape) or invalid_output (URL or key rejected; the message never contains the key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Clear the stream destination (admin only)
      responses:
        "204": {description: Cleared (also when none was stored)}
        default: {$ref: "#/components/responses/Error"}
  /stream/stop:
    post:
      summary: Request cooperative stream stop (IPC stream.stop)
      responses:
        "200": {description: Stop requested, content: {application/json: {schema: {type: object}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes:
    get:
      summary: List stored scene drafts
      responses:
        "200":
          description: Drafts ordered by id
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StoredScene"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create a scene from a name (id derived from the name, made unique)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                document: {$ref: "scene.schema.json"}
      responses:
        "201": {description: Created at revision 1, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes/import:
    post:
      summary: Import an export as a new scene (never overwrites)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SceneExport"}
      responses:
        "201": {description: Imported, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}/duplicate:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    post:
      summary: Copy a scene's current revision into a new scene
      responses:
        "201": {description: Copy, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}/export:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    get:
      summary: Portable export (Content-Disposition attachment)
      responses:
        "200": {description: Export, content: {application/json: {schema: {$ref: "#/components/schemas/SceneExport"}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    get:
      summary: Fetch one scene draft
      responses:
        "200": {description: Draft, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Create (revision 0) or update a draft with optimistic concurrency
      description: Saving a draft never changes Program. 409 when revision is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, document]
              properties:
                revision: {type: integer, minimum: 0}
                document: {$ref: "scene.schema.json"}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a draft (and its history) at the expected revision
      parameters:
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}/revisions:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    get:
      summary: Bounded draft history, newest first (last 50 revisions)
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [revision, created_at_unix, document]
                  properties:
                    revision: {type: integer, minimum: 1}
                    created_at_unix: {type: integer}
                    document: {$ref: "scene.schema.json"}
        default: {$ref: "#/components/responses/Error"}
  /cameras/session/offer:
    post:
      summary: Start the phone camera session (WebRTC offer → answer)
      description: |
        Relays the phone's SDP offer to stephania-phone (docs/PHONE.md) and
        returns the non-trickle answer. Media never passes through this
        API. `tracks` maps the offer's MediaStreamTrack ids to roles. One
        phone at a time: an active session answers 409 busy unless
        `replace` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sdp, tracks]
              properties:
                sdp: {type: string, maxLength: 32768}
                tracks:
                  type: object
                  minProperties: 1
                  maxProperties: 2
                  additionalProperties: {enum: [rear, front]}
                replace: {type: boolean}
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                type: object
                required: [sdp]
                properties: {sdp: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /cameras/session:
    get:
      summary: Phone session status
      responses:
        "200":
          description: Status (state none when no session)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string}
                  access_units: {type: object, additionalProperties: {type: integer}}
                  keyframe_requests: {type: integer}
                  dropped: {type: integer}
                  age_ms: {type: integer}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: End the phone session
      responses:
        "204": {description: Closed (also when none was active)}
        default: {$ref: "#/components/responses/Error"}
  /credentials/camera:
    post:
      summary: Issue a camera-role credential (owner only)
      description: |
        Short-lived token (`t3c_…`, shown once, stored as SHA-256) that can
        only use the camera session endpoints; every other route answers
        403 forbidden_role. A camera cannot replace or end a session it did
        not open. Revoking the credential ends the session it opened.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl_s: {type: integer, minimum: 60, maximum: 86400, default: 43200}
                label: {type: string, minLength: 1, maxLength: 64}
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/CameraCredential"}
                  - type: object
                    required: [token]
                    properties: {token: {type: string, pattern: "^t3c_[0-9a-f]{64}$"}}
        default: {$ref: "#/components/responses/Error"}
    get:
      summary: List unexpired camera credentials (never the tokens)
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CameraCredential"}}
        default: {$ref: "#/components/responses/Error"}
  /credentials/camera/{id}:
    delete:
      summary: Revoke a camera credential (ends its phone session)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{8}$"}}
      responses:
        "204": {description: Revoked}
        default: {$ref: "#/components/responses/Error"}
  /maintenance:
    get:
      summary: Maintenance window state (admin only)
      description: |
        Maintenance SSH (docs/MAINTENANCE.md). Every /maintenance route is
        admin only (operators get 403 forbidden_role) and relayed to
        stephania-maint, which checks codes and holds the SSH CAs.
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                type: object
                required: [open, window, code_locked_until]
                properties:
                  open: {type: boolean}
                  window:
                    oneOf:
                      - {$ref: "#/components/schemas/MaintenanceWindow"}
                      - {type: "null"}
                  code_locked_until: {type: [integer, "null"], description: Unix time until which code entry is locked}
        default: {$ref: "#/components/responses/Error"}
  /maintenance/window:
    post:
      summary: Open a maintenance window with the code shown in Stephania Connect
      description: |
        The 6-digit code (RFC 6238, 30 s) works once. One window at a time;
        a window accepts certificate requests for 10 minutes (root: 5) and
        its sessions end after 60 minutes (root: 30). Opening it starts sshd
        on port 22, reachable from private addresses only. Loopback, IPv6
        link-local and the device's own addresses are refused (422).
        Five wrong codes lock code entry (429 with Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, pattern: "^[0-9]{6}$"}
                root: {type: boolean, default: false, description: Log in as root instead of maint}
      responses:
        "201":
          description: Opened
          content:
            application/json:
              schema:
                type: object
                required: [window_id, expires_at, sessions_end_at, root, user]
                properties:
                  window_id: {type: string, pattern: "^[0-9a-f]{16}$"}
                  expires_at: {type: integer, description: Unix time; no certificates after it}
                  sessions_end_at: {type: integer, description: Unix time; sessions are ended then}
                  root: {type: boolean}
                  user: {type: string, enum: [maint, root]}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Close the maintenance window (stops sshd, ending its sessions)
      responses:
        "204": {description: Closed (also when none was open)}
        default: {$ref: "#/components/responses/Error"}
  /maintenance/certificate:
    post:
      summary: Sign a 5-minute SSH user certificate for a fresh Ed25519 key
      description: |
        Only for the account that opened the window, from the address it
        was opened from (403 not_window_opener otherwise). The certificate
        is bound to that address (source-address), allows only a PTY, and
        names the account in its key ID. Trust the device with
        `@cert-authority <host> <host_ca>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [window_id, public_key]
              properties:
                window_id: {type: string, pattern: "^[0-9a-f]{16}$"}
                public_key: {type: string, maxLength: 512, description: "OpenSSH public key line, ssh-ed25519 only"}
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                type: object
                required: [certificate, valid_before, serial, host_ca, principal, user, host, port]
                properties:
                  certificate: {type: string, description: OpenSSH certificate line (ssh-ed25519-cert-v01@openssh.com)}
                  valid_before: {type: integer}
                  serial: {type: integer}
                  host_ca: {type: string, description: Host CA public key line}
                  principal: {type: string, enum: [maint, maint-root]}
                  user: {type: string, enum: [maint, root]}
                  host: {type: string, description: The host name this request used}
                  port: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /audio:
    get:
      summary: Program audio inputs (stored configuration and live engine status)
      responses:
        "200":
          description: Configuration and status
          content:
            application/json:
              schema:
                type: object
                required: [stored, engine]
                properties:
                  stored: {type: array, items: {$ref: "#/components/schemas/AudioInput"}}
                  engine:
                    description: ipc.schema.json#/$defs/audio_status, or null when the engine is unreachable
                    oneOf: [{type: "null"}, {$ref: "ipc.schema.json#/$defs/audio_status"}]
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Update audio inputs (partial; gain and mute apply live)
      description: |
        Omitted fields keep their value. Saved, then applied to the engine;
        when the engine is unreachable the configuration is applied as soon
        as it reconnects (`applied: false`). Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "ipc.schema.json#/$defs/audio_configure_params"}
      responses:
        "200":
          description: Saved (and applied when the engine is reachable)
          content:
            application/json:
              schema:
                type: object
                required: [stored, applied]
                properties:
                  stored: {type: array, items: {$ref: "#/components/schemas/AudioInput"}}
                  applied: {type: boolean}
                  engine:
                    oneOf: [{type: "null"}, {$ref: "ipc.schema.json#/$defs/audio_status"}]
        default: {$ref: "#/components/responses/Error"}
  /assets:
    get:
      summary: List image assets
      responses:
        "200": {description: Assets, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Asset"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Upload a PNG (raw body, Content-Type image/png); content-addressed
      description: |
        id = first 16 hex digits of the file's SHA-256. Uploading identical
        content returns the existing asset with 200. At most 8 MiB, 1..4096
        pixels per side, 256 assets.
      parameters:
        - {name: name, in: query, required: false, schema: {type: string, maxLength: 100}}
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/Asset"}}}}
        "200": {description: Already stored, content: {application/json: {schema: {$ref: "#/components/schemas/Asset"}}}}
        default: {$ref: "#/components/responses/Error"}
  /assets/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{16}$"}}
    get:
      summary: The PNG itself (immutable, cacheable)
      responses:
        "200": {description: PNG, content: {image/png: {schema: {type: string, format: binary}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete an asset no scene references (409 asset_in_use otherwise)
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /templates:
    get:
      summary: Developer overlay templates (SVG with {{variables}}, rendered to PNG by the Studio)
      responses:
        "200": {description: Templates, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/OverlayTemplate"}}}}}
        default: {$ref: "#/components/responses/Error"}
  /templates/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]{1,32}$"}}
    put:
      summary: Create or replace a developer template (admin). Scripts, event handlers and external references are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, width, height, svg, vars]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                width: {type: integer, minimum: 1, maximum: 1920}
                height: {type: integer, minimum: 1, maximum: 1080}
                svg: {type: string, maxLength: 20000}
                vars: {type: array, maxItems: 16, items: {$ref: "#/components/schemas/TemplateVar"}}
      responses:
        "200": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/OverlayTemplate"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a developer template
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /program/transition:
    post:
      summary: Apply a stored draft revision to Program (IPC scene.apply)
      description: |
        Succeeds only after the engine acknowledges frame-boundary application
        (response `engine.first_frame_index`). Program is unchanged on 501
        not_implemented (compositor disabled), 409 program_inactive (no stream
        running), 503 program_timeout (not on air within the engine's 4 s
        scene.apply deadline; it is never applied later), 413
        request_too_large (the scene does not fit one IPC frame), or 422
        invalid_scene when an image asset cannot be loaded. With a fade the acknowledged frame is the
        first one showing any of the new Program.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scene_id, revision]
              properties:
                scene_id: {$ref: "#/components/schemas/Id"}
                revision: {type: integer, minimum: 1}
                transition: {$ref: "ipc.schema.json#/$defs/transition"}
      responses:
        "200":
          description: Applied and acknowledged by the engine at a frame boundary
          content:
            application/json:
              schema:
                type: object
                required: [scene_id, revision, engine]
                properties:
                  scene_id: {$ref: "#/components/schemas/Id"}
                  revision: {type: integer}
                  engine:
                    type: object
                    required: [applied, scene_id, revision, first_frame_index]
                    properties:
                      applied: {const: true}
                      scene_id: {type: string}
                      revision: {type: integer}
                      first_frame_index: {type: integer, minimum: 0}
                      transition: {$ref: "ipc.schema.json#/$defs/transition"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    session: {type: apiKey, in: cookie, name: stephania_session, description: "Studio account session; writes also need X-CSRF-Token"}
  schemas:
    OutputStatus:
      type: object
      additionalProperties: false
      required: [configured, url, key_last4, updated_at_unix]
      properties:
        configured: {type: boolean}
        url: {type: [string, "null"], description: Ingest server URL without the key}
        key_last4: {type: [string, "null"], description: Last 4 characters of the stream key, to recognise which key is set}
        updated_at_unix: {type: [integer, "null"]}
    TemplateVar:
      type: object
      additionalProperties: false
      required: [key, label, initial]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_.]{0,31}$"}
        label: {type: string, minLength: 1, maxLength: 100}
        initial: {type: string, maxLength: 200}
    OverlayTemplate:
      type: object
      additionalProperties: false
      required: [id, name, width, height, svg, vars]
      properties:
        id: {type: string}
        name: {type: string}
        width: {type: integer}
        height: {type: integer}
        svg: {type: string}
        vars: {type: array, items: {$ref: "#/components/schemas/TemplateVar"}}
    Asset:
      type: object
      additionalProperties: false
      required: [id, name, width, height, bytes, created_at_unix]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{16}$"}
        name: {type: string}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer}
        created_at_unix: {type: integer}
    Role:
      enum: [admin, operator]
      description: operator may start/stop, switch Program and change audio; it cannot edit scenes or manage accounts and credentials.
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, disabled, created_at_unix]
      properties:
        id: {type: integer}
        username: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        disabled: {type: boolean}
        created_at_unix: {type: integer}
    SceneExport:
      type: object
      additionalProperties: false
      required: [format, version, document]
      properties:
        format: {const: stephania-scene}
        version: {const: 1}
        id: {$ref: "#/components/schemas/Id"}
        document: {$ref: "scene.schema.json"}
    AudioInput:
      type: object
      required: [id, enabled, device, channels, gain_db, muted]
      properties:
        id: {enum: [hdmi, mic]}
        enabled: {type: boolean}
        device: {type: string}
        channels: {enum: [1, 2]}
        gain_db: {type: number, minimum: -60, maximum: 12}
        muted: {type: boolean}
    CameraCredential:
      type: object
      required: [id, label, created_at_unix, expires_at_unix]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{8}$"}
        label: {type: string}
        created_at_unix: {type: integer}
        expires_at_unix: {type: integer}
    Id: {type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$"}
    StoredScene:
      type: object
      additionalProperties: false
      required: [id, revision, document]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        revision: {type: integer, minimum: 1}
        document: {$ref: "scene.schema.json"}
    MaintenanceWindow:
      type: object
      required: [root, actor, user, opened_at, expires_at, sessions_end_at, accepting]
      properties:
        window_id: {type: string, description: Only for the account that opened the window}
        root: {type: boolean}
        actor: {type: string, description: Account name, or "owner" for an enrolled owner token}
        client_addr: {type: string, description: Address the window was opened from}
        user: {type: string, enum: [maint, root]}
        opened_at: {type: integer}
        expires_at: {type: integer}
        sessions_end_at: {type: integer}
        accepting: {type: boolean, description: Certificates can still be issued}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                unauthorized(401) not_configured(503) forbidden_host(403) forbidden_origin(403) invalid_json(400)
                invalid_id(400) body_too_large(413) invalid_request(422) invalid_scene(422)
                not_found(404) revision_conflict(409) engine_unavailable(503)
                engine_start_failed(503) busy(503) not_implemented(501) program_inactive(409)
                program_timeout(503) request_too_large(413) too_many_streams(429) busy(409, phone) invalid_offer(422) phone_unavailable(503) forbidden_role(403) invalid_audio(422)
                too_many_credentials(409) csrf_failed(403) invalid_login(401) login_throttled(429)
                weak_password(422) user_exists(409) last_admin(409)
                unknown_asset(422) invalid_asset(422) invalid_template(422) too_many_templates(409) asset_in_use(409) too_many_assets(409) unsupported_media_type(415)
                invalid_code(401, maintenance) code_throttled(429) window_open(409) window_closed(409)
                not_window_opener(403) reserved_username(422 on create, 409 on maintenance) maintenance_failed(503) maintenance_unavailable(503) invalid_params(422, maintenance)
                invalid_output(422) storage_failed(503)
                internal_error(500);
                unrecognised engine codes are passed through with 502.
            message: {type: string}
            request_id: {type: string, description: Same value as the X-Request-Id response header and the IPC request_id.}
  responses:
    Error:
      description: Error envelope
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
