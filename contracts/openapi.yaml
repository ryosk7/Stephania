openapi: 3.1.0
info:
  title: T3Box Control API
  version: 0.1.0
  description: |
    Management plane served by services/control (Sinatra). Plain HTTP is
    loopback-only (bootstrap token). On the LAN it is served only over TLS
    with the device-CA certificate (port 9443), Host must be a certified
    device name/address, cross-origin requests are rejected, and only
    owner-issued tokens (BLE management.enroll) are accepted. No media
    passes through this API. Only the operations below are
    implemented; the full target surface is in docs/MASTER-ARCHITECTURE.md §18.
servers:
  - url: http://127.0.0.1:9292/api/v1
  - url: https://{device}.local:9443/api/v1
    variables:
      device: {default: t3box}
security:
  - bearer: []
paths:
  /capabilities:
    get:
      summary: Management-plane feature flags
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [scene_drafts, program_apply, phone_camera, ble]
                properties:
                  scene_drafts: {type: boolean}
                  program_apply: {const: false}
                  phone_camera: {const: false}
                  ble: {const: false}
        default: {$ref: "#/components/responses/Error"}
  /status:
    get:
      summary: Engine status (IPC engine.status)
      responses:
        "200":
          description: |
            Engine status (ipc.schema.json#/$defs/engine_status) plus engine_restarted,
            true when instance_id differs from the previous call (clients must re-read
            state). native_worker_running is worker activity, not ingest confirmation.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "ipc.schema.json#/$defs/engine_status"}
                  - type: object
                    required: [engine_restarted]
                    properties: {engine_restarted: {type: boolean}}
        default: {$ref: "#/components/responses/Error"}
  /events:
    get:
      summary: Server-Sent Events stream of device state changes
      description: |
        text/event-stream. The first event is always `snapshot`
        ({engine: engine_status|null, scenes: [{id, revision}]}); clients
        reconcile from it on every (re)connect. Then: engine.connected,
        engine.unavailable, engine.restarted, stream.state_changed
        ({state, streaming_requested, native_worker_running, last_error}),
        program.changed ({scene_id, revision}), scene.updated
        ({id, revision}), scene.deleted ({id}). Comment lines are
        keepalives (every 15 s). Slow consumers are disconnected. Unknown
        event names must be ignored.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        "429":
          description: Concurrent stream limit (8) reached (error code too_many_streams)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        default: {$ref: "#/components/responses/Error"}
  /engine/capabilities:
    get:
      summary: Engine capabilities (IPC engine.capabilities)
      responses:
        "200": {description: Engine capabilities, content: {application/json: {schema: {type: object}}}}
        default: {$ref: "#/components/responses/Error"}
  /stream/start:
    post:
      summary: Request stream start (IPC stream.start)
      responses:
        "202":
          description: Request accepted by the engine; not confirmation of ingest.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, streaming_requested, youtube_ingest_confirmed]
                properties:
                  accepted: {const: true}
                  streaming_requested: {const: true}
                  youtube_ingest_confirmed: {const: false}
        default: {$ref: "#/components/responses/Error"}
  /stream/stop:
    post:
      summary: Request cooperative stream stop (IPC stream.stop)
      responses:
        "200": {description: Stop requested, content: {application/json: {schema: {type: object}}}}
        default: {$ref: "#/components/responses/Error"}
  /scenes:
    get:
      summary: List stored scene drafts
      responses:
        "200":
          description: Drafts ordered by id
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/StoredScene"}}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    get:
      summary: Fetch one scene draft
      responses:
        "200": {description: Draft, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Create (revision 0) or update a draft with optimistic concurrency
      description: Saving a draft never changes Program. 409 when revision is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, document]
              properties:
                revision: {type: integer, minimum: 0}
                document: {$ref: "scene.schema.json"}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/StoredScene"}}}}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a draft (and its history) at the expected revision
      parameters:
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /scenes/{id}/revisions:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    get:
      summary: Bounded draft history, newest first (last 50 revisions)
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [revision, created_at_unix, document]
                  properties:
                    revision: {type: integer, minimum: 1}
                    created_at_unix: {type: integer}
                    document: {$ref: "scene.schema.json"}
        default: {$ref: "#/components/responses/Error"}
  /cameras/session/offer:
    post:
      summary: Start the phone camera session (WebRTC offer → answer)
      description: |
        Relays the phone's SDP offer to t3box-phone (docs/PHONE.md) and
        returns the non-trickle answer. Media never passes through this
        API. `tracks` maps the offer's MediaStreamTrack ids to roles. One
        phone at a time: an active session answers 409 busy unless
        `replace` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sdp, tracks]
              properties:
                sdp: {type: string, maxLength: 32768}
                tracks:
                  type: object
                  minProperties: 1
                  maxProperties: 2
                  additionalProperties: {enum: [rear, front]}
                replace: {type: boolean}
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                type: object
                required: [sdp]
                properties: {sdp: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /cameras/session:
    get:
      summary: Phone session status
      responses:
        "200":
          description: Status (state none when no session)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string}
                  access_units: {type: object, additionalProperties: {type: integer}}
                  keyframe_requests: {type: integer}
                  dropped: {type: integer}
                  age_ms: {type: integer}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: End the phone session
      responses:
        "204": {description: Closed (also when none was active)}
        default: {$ref: "#/components/responses/Error"}
  /program/transition:
    post:
      summary: Apply a stored draft revision to Program (IPC scene.apply)
      description: |
        Succeeds only after the engine acknowledges frame-boundary application
        (response `engine.first_frame_index`). Program is unchanged on 501
        not_implemented (compositor disabled), 409 program_inactive (no stream
        running) or 503 program_timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scene_id, revision]
              properties:
                scene_id: {$ref: "#/components/schemas/Id"}
                revision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Applied and acknowledged by the engine at a frame boundary
          content:
            application/json:
              schema:
                type: object
                required: [scene_id, revision, engine]
                properties:
                  scene_id: {$ref: "#/components/schemas/Id"}
                  revision: {type: integer}
                  engine:
                    type: object
                    required: [applied, scene_id, revision, first_frame_index]
                    properties:
                      applied: {const: true}
                      scene_id: {type: string}
                      revision: {type: integer}
                      first_frame_index: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    Id: {type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$"}
    StoredScene:
      type: object
      additionalProperties: false
      required: [id, revision, document]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        revision: {type: integer, minimum: 1}
        document: {$ref: "scene.schema.json"}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: |
                unauthorized(401) not_configured(503) forbidden_host(403) forbidden_origin(403) invalid_json(400)
                invalid_id(400) body_too_large(413) invalid_request(422) invalid_scene(422)
                not_found(404) revision_conflict(409) engine_unavailable(503)
                engine_start_failed(503) busy(503) not_implemented(501) program_inactive(409)
                program_timeout(503) too_many_streams(429) busy(409, phone) invalid_offer(422) phone_unavailable(503)
                internal_error(500);
                unrecognised engine codes are passed through with 502.
            message: {type: string}
            request_id: {type: string, description: Same value as the X-Request-Id response header and the IPC request_id.}
  responses:
    Error:
      description: Error envelope
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
