<!-- Install as /etc/dbus-1/system.d/stephania-ble.conf
     Lets the unprivileged stephania-ble user register a GATT application and an
     advertisement with BlueZ without running as root. The only rule names
     org.bluez as the destination: an interface rule without a destination
     would apply to every service on the bus (dbus-daemon(1)), for example
     wpa_supplicant. Signals and replies to BlueZ's calls into the adapter
     (GattCharacteristic1, LEAdvertisement1, ObjectManager) need no rule. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="stephania-ble">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
