# systemd-tmpfiles(8): install as /usr/lib/tmpfiles.d/t3box.conf
# Owner-issued LAN token hashes: written by t3box-provision, read by
# t3box-control. setgid so new files inherit the control group.
d /var/lib/t3box/tokens 2750 t3box-provision t3box-control -
# Scene image assets: written by t3box-control (content-addressed PNGs),
# read by the engine (t3box group). setgid keeps the group on new files.
d /var/lib/t3box/assets 2750 t3box-control t3box -
