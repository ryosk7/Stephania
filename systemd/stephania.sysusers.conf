# systemd-sysusers(8): install as /usr/lib/sysusers.d/stephania.conf
# Fixed uids so the engine unit can name the control uid in
# STEPHANIA_IPC_ALLOWED_UIDS. Adjust both together if these collide on the image.
u stephania          851 "Stephania media engine" /nonexistent
u stephania-control  852 "Stephania management plane" /nonexistent
m stephania-control  stephania
m stephania          video
m stephania          audio
u stephania-provision 853 "Stephania provisioning" /nonexistent
u stephania-ble 854 "Stephania BLE adapter" /nonexistent
m stephania-ble bluetooth
m stephania-ble stephania-provision
u stephania-phone 855 "Stephania phone WebRTC receiver" /nonexistent
m stephania-phone stephania
m stephania-control stephania-phone
# Maintenance (docs/MAINTENANCE.md): the service holding the SSH CAs, and
# the login user of maintenance windows (no password; certificates only).
u stephania-maint 856 "Stephania maintenance service" /nonexistent
m stephania-control stephania-maint
m stephania-provision stephania-maint
u maint 857 "Stephania maintenance login" /var/lib/stephania/maint-home /bin/bash
m maint systemd-journal
# stephania-maint reads engine status (on-air check) and owns ops.sock
# with the maint group.
m stephania-maint stephania
m stephania-maint maint
