# systemd-tmpfiles(8): install as /usr/lib/tmpfiles.d/stephania.conf
# Owner-issued LAN token hashes: written by stephania-provision, read by
# stephania-control. setgid so new files inherit the control group.
d /var/lib/stephania/tokens 2750 stephania-provision stephania-control -
# Scene image assets: written by stephania-control (content-addressed PNGs),
# read by the engine (stephania group). setgid keeps the group on new files.
d /var/lib/stephania/assets 2750 stephania-control stephania -
# Maintenance CAs, host key and code secret: stephania-maint only.
d /var/lib/stephania/maint 0700 stephania-maint stephania-maint -
# Home of the maint login user.
d /var/lib/stephania/maint-home 0700 maint maint -
# Uploads during a maintenance window (stephctl cp); emptied at boot.
D /var/lib/stephania/inbox 2770 stephania-maint maint -
