# systemd-sysusers(8): install as /usr/lib/sysusers.d/t3box.conf
# Fixed uids so the engine unit can name the control uid in
# T3BOX_IPC_ALLOWED_UIDS. Adjust both together if these collide on the image.
u t3box          851 "T3Box media engine" /nonexistent
u t3box-control  852 "T3Box management plane" /nonexistent
m t3box-control  t3box
m t3box          video
m t3box          audio
u t3box-provision 853 "T3Box provisioning" /nonexistent
u t3box-ble 854 "T3Box BLE adapter" /nonexistent
m t3box-ble bluetooth
m t3box-ble t3box-provision
