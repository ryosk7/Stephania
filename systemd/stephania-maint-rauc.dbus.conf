<!-- Install as /etc/dbus-1/system.d/stephania-maint-rauc.conf
     RAUC's own policy (de.pengutronix.rauc.conf) lets every local user call
     every RAUC method. This file, read after it, narrows that: other users
     may only read the status (`steph update status` as maint), stephania-maint
     may also install a bundle for `steph update apply` (docs/MAINTENANCE.md;
     RAUC still verifies the signature and the pre-install handler refuses
     older releases), and only root may mark slots good, bad or active, which
     stephania-bootctl does after its health check. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetSlotStatus"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetArtifactStatus"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetPrimary"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="stephania-maint">
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="InstallBundle"/>
  </policy>
</busconfig>
