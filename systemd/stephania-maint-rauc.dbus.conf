<!-- Install as /etc/dbus-1/system.d/stephania-maint-rauc.conf
     Lets stephania-maint ask RAUC to install a bundle for `steph update
     apply` (docs/MAINTENANCE.md). RAUC still verifies the signature. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="stephania-maint">
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
