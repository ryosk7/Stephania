plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.t3boxpinnedfetch'
version = '0.1.0'

android {
  namespace "expo.modules.t3boxpinnedfetch"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.all {
      // Device PKI material for PinnedHttpTest (ci/mobile-android.sh).
      environment "T3BOX_PKI_P12", System.getenv("T3BOX_PKI_P12") ?: ""
      environment "T3BOX_PKI_CA_SHA256", System.getenv("T3BOX_PKI_CA_SHA256") ?: ""
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
